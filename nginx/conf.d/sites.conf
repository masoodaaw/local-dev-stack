resolver 127.0.0.11 valid=10s;

# Default catch-all server for unconfigured domains
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $upstream_default http://default-app:80;
        proxy_pass $upstream_default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The certificate is valid for myhomeworksheets.com only.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/myhomeworksheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myhomeworksheets.com/privkey.pem;
    include /etc/nginx/custom/ssl-params.conf;

    location / {
        set $upstream_default http://default-app:80;
        proxy_pass $upstream_default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
