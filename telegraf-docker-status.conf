[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "tcp://docker-socket-proxy:2375"
  timeout = "5s"
  container_name_include = ["dev-*"]
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service", "com.docker.compose.project.config_files"]

[[processors.enum]]
  [[processors.enum.mapping]]
    tags = ["container_status"]
    dest = "status_code"
    [processors.enum.mapping.value_mappings]
      created = 1
      restarting = 2
      running = 3
      removing = 4
      paused = 5
      exited = 6
      dead = 7

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  string_as_label = true
  expiration_interval = "60s"
