# TLS terminator for Infisical. Only HTTPS is published on the host.
# Backend speaks HTTP on the internal Docker network.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  map_hash_bucket_size 128;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Reject plain HTTP — secrets UI is HTTPS-only.
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Docker embedded DNS — re-resolve after Infisical recreates (avoid stale IP 502s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $infisical_upstream infisical:8080;

    location / {
      proxy_http_version 1.1;
      proxy_pass http://$infisical_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }
}
