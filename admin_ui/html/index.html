<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Local development container directory with administration links and service endpoints.">
  <title>Dev Containers | Service Directory</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container-xxl d-flex align-items-center justify-content-between gap-3 py-3">
      <a class="brand text-decoration-none" href="./"><i class="bi bi-boxes" aria-hidden="true"></i> Dev Containers</a>
      <span class="host-label"><i class="bi bi-hdd-network me-2" aria-hidden="true"></i><span id="hostname"></span></span>
    </div>
  </header>
  <main class="container-xxl py-4 py-lg-5">
    <div class="heading-row d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <p class="eyebrow mb-2">LOCAL WORKSPACE</p>
        <h1 class="mb-1">Service directory</h1>
        <p class="text-secondary mb-0">Administration, observability &amp; development endpoints</p>
      </div>
      <div class="totals"><strong id="service-count">0</strong> services <span aria-hidden="true">/</span> <strong id="web-count">0</strong> web destinations</div>
    </div>
    <div class="directory-toolbar row g-3 align-items-end mb-4">
      <div class="col-md-8 col-lg-9">
        <label for="search" class="form-label">Find a service</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span><input id="search" type="search" class="form-control" placeholder="Name, container or port" autocomplete="off"></div>
      </div>
      <div class="col-md-4 col-lg-3"><label for="category" class="form-label">Category</label><select id="category" class="form-select"><option value="">All categories</option></select></div>
    </div>
    <output id="results" class="d-block small text-secondary mb-3" aria-live="polite"></output>
    <div id="directory"></div>
    <p id="empty" class="empty-state" hidden>No services match your search.</p>
    <noscript><p class="alert alert-warning">JavaScript is required to display the service directory.</p></noscript>
  </main>
  <footer class="container-xxl pb-4 d-flex flex-wrap justify-content-between gap-2 small text-secondary"><span>dev-containers <span class="mx-2" aria-hidden="true">/</span> linux-containers.yml</span><span>Endpoint directory <span class="mx-2" aria-hidden="true">/</span> Availability not monitored</span></footer>
  <output id="copy-status" class="visually-hidden" aria-live="polite"></output>
</body>
</html>
