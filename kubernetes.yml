name: kubernetes-lab

services:
  k3s:
    image: rancher/k3s:v1.31.6-k3s1
    privileged: true
    hostname: k3s
    restart: unless-stopped
    command: server --write-kubeconfig-mode=600 --node-name=k3s
    ports:
      - "127.0.0.1:16443:6443"
      - "${K8S_LAB_PORT:-127.0.0.1:18080}:80"
    volumes:
      - type: bind
        source: ${DATA_DIR}/kubernetes/k3s
        target: /var/lib/rancher/k3s
        bind:
          create_host_path: false
      - type: bind
        source: ./kubernetes/landscape.yaml
        target: /var/lib/rancher/k3s/server/manifests/landscape.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - kubernetes-lab

networks:
  kubernetes-lab:
    name: kubernetes-lab
    ipam:
      config:
        - subnet: 172.31.240.0/24
