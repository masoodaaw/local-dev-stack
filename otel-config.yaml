receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  fluentforward:
    endpoint: 0.0.0.0:24224

  file_log/postgres_audit:
    include:
      - /var/lib/postgresql/data/log/*.audit.json
    start_at: end
    include_file_path: true
    resource:
      service.name: dev-postgres
      log.type: database_audit
      db.system: postgresql
    operators:
      - type: json_parser
        parse_from: body

  file_log/mariadb_audit:
    include:
      - /var/lib/mysql/audit.log
    start_at: end
    include_file_path: true
    multiline:
      line_start_pattern: '^(?:[0-9]{6}[[:space:]]+[0-9]{1,2}:[0-9]{2}:[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+[0-9]{2}:[0-9]{2}:[0-9]{2})[[:space:]]+'
    resource:
      service.name: dev-mariadb
      log.type: database_audit
      db.system: mariadb

  file_log/redis_audit:
    include:
      - /var/log/audit/redis/commands.log*
    start_at: end
    include_file_path: true
    resource:
      service.name: dev-redis
      log.type: database_audit
      db.system: redis

processors:
  transform/service_name:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], attributes["fluent.tag"]) where attributes["fluent.tag"] != nil

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: detailed

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [fluentforward, otlp, file_log/postgres_audit, file_log/mariadb_audit, file_log/redis_audit]
      processors: [transform/service_name, batch]
      exporters: [otlphttp/loki]