name: web-apps

services:
  # 1. Dynamic DNS Updater (Secrets & cache in /opt/dev-data)
  ddns-updater:
    image: lscr.io/linuxserver/ddclient:latest
    container_name: ddns-updater
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/dev-data/ddclient:/config
    restart: unless-stopped

  # 2. Nginx Gateway & Load Balancer (Configs from /opt/repos, Certs & Logs from /opt/dev-data)
  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/repos/local-dev-stack/nginx/conf.d:/etc/nginx/conf.d:ro
      - /opt/repos/local-dev-stack/nginx/ssl-params.conf:/etc/nginx/custom/ssl-params.conf:ro
      - /opt/dev-data/nginx/logs:/var/log/nginx
      - /opt/dev-data/certbot/conf:/etc/letsencrypt:ro
      - /opt/dev-data/certbot/www:/var/www/certbot:ro
    depends_on:
      - default-app
      - site1-app
      - site2-app
    networks:
      - dev-network
    restart: unless-stopped

  # 3. SSL Certificate Manager (Certs, API tokens & logs in /opt/dev-data)
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: certbot
    volumes:
      - /opt/dev-data/certbot/conf:/etc/letsencrypt
      - /opt/dev-data/certbot/www:/var/www/certbot
      - /opt/dev-data/certbot/logs:/var/log/letsencrypt
      - /opt/dev-data/certbot/cloudflare.ini:/cloudflare.ini:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # 4. Default Fallback Website (Static template from /opt/repos)
  default-app:
    image: nginx:alpine
    container_name: default-app
    volumes:
      - /opt/repos/local-dev-stack/default-site:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - dev-network
    restart: unless-stopped

  # 5. Website 1 - Load Balanced Replicas (Content from /opt/dev-data)
  site1-app:
    image: nginx:alpine
    volumes:
      - /opt/dev-data/site1-data:/usr/share/nginx/html:ro
    expose:
      - "80"
    deploy:
      replicas: 2
    networks:
      - dev-network
    restart: unless-stopped

  # 6. Website 2 - Single Container (Content from /opt/dev-data)
  site2-app:
    image: nginx:alpine
    volumes:
      - /opt/dev-data/site2-data:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    external: true


