name: web-apps

x-logging: &web-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    fluentd-async: "true"
    fluentd-retry-wait: "1s"
    tag: "{{.Name}}"

x-web-healthcheck: &web-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

configs:
  ddclient-config:
    content: |
      daemon=${DDCLIENT_DAEMON:-300}
      syslog=${DDCLIENT_SYSLOG:-no}
      ssl=${DDCLIENT_SSL:-yes}
      usev4=${DDCLIENT_USEV4:-webv4}, webv4=${DDCLIENT_WEBV4:-https://api.ipify.org/}
      protocol=${DDCLIENT_PROTOCOL:-dyndns2}
      server=${DDCLIENT_SERVER:-dynv6.com}
      login=${DDCLIENT_LOGIN:-none}
      password='${DYNV6_TOKEN:-}'
      ${DYNV6_ZONE:-}

services:
  # 1. Dynamic DNS Updater
  ddns-updater:
    image: lscr.io/linuxserver/ddclient@sha256:8daff71cbdc8ef9b9e2db35617dcff250f3f219fe3f8110940107ceed0f9eb7b
    container_name: ddns-updater
    logging: *web-logging
    user: "1000:1000"
    entrypoint: ["/usr/bin/ddclient"]
    command: ["--foreground", "--file", "/run/ddclient.conf", "--cache", "/tmp/ddclient.cache"]
    volumes:
      - type: bind
        source: ${DATA_DIR}/ddclient
        target: /config
        bind:
          create_host_path: false
    configs:
      - source: ddclient-config
        target: /run/ddclient.conf
        uid: "1000"
        gid: "1000"
        mode: 0400
    restart: unless-stopped

  # 2. Nginx Proxy Manager (vhosts, SSL, redirects via Admin UI)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1
    container_name: nginx-proxy-manager
    logging: *web-logging
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      TZ: ${TZ:-UTC}
      DISABLE_IPV6: ${NPM_DISABLE_IPV6:-false}
    ports:
      - "80:80"
      - "443:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - type: bind
        source: ${DATA_DIR}/nginx-proxy-manager/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR}/nginx-proxy-manager/letsencrypt
        target: /etc/letsencrypt
        bind:
          create_host_path: false
    depends_on:
      - default-app
      - site1-app
      - site2-app
    networks:
      - dev-network
    restart: unless-stopped

  # 3. Default Fallback Website
  default-app:
    image: nginx@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: default-app
    logging: *web-logging
    healthcheck: *web-healthcheck
    volumes:
      - type: bind
        source: ${REPO_DIR:-.}/default-site
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "80"
    networks:
      - dev-network
    restart: unless-stopped

  # 4. Website 1 (Load Balanced across 2 replicas)
  site1-app:
    image: nginx@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    logging: *web-logging
    healthcheck: *web-healthcheck
    volumes:
      - type: bind
        source: ${DATA_DIR}/site1-data
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "80"
    deploy:
      replicas: 2
    networks:
      - dev-network
    restart: unless-stopped

  # 5. Website 2 (Single container)
  site2-app:
    image: nginx@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    logging: *web-logging
    healthcheck: *web-healthcheck
    volumes:
      - type: bind
        source: ${DATA_DIR}/site2-data
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "80"
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    external: true
