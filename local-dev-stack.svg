<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1200" role="img" aria-labelledby="title desc">
  <title id="title">Universal Local Dev Infrastructure Stack</title>
  <desc id="desc">Architecture diagram of a Docker Compose local development stack with databases, cloud emulators, messaging, observability, dashboards, and persistent local volumes.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f6"/>
      <stop offset="1" stop-color="#edf2f5"/>
    </linearGradient>
    <linearGradient id="network" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#f7faf9" stop-opacity=".96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#203641" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Aptos", sans-serif; fill: #18313a; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #4a706b; }
      .title { font-size: 35px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #587078; }
      .group-title { font-size: 14px; font-weight: 700; letter-spacing: .7px; }
      .service { font-size: 14px; font-weight: 650; }
      .detail { font-size: 11px; fill: #63777b; }
      .tiny { font-size: 10px; fill: #60747a; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 10px; fill: #526a70; }
      .node { fill: #fff; stroke: #dce6e4; stroke-width: 1; }
      .line { fill: none; stroke: #a9bfba; stroke-width: 1.5; stroke-dasharray: 5 6; }
    </style>
  </defs>

  <rect width="1680" height="1200" fill="url(#canvas)"/>
  <circle cx="1540" cy="90" r="155" fill="#dcece6" opacity=".45"/>
  <circle cx="95" cy="1080" r="190" fill="#deebf1" opacity=".42"/>

  <g transform="translate(72 52)">
    <rect width="48" height="48" rx="14" fill="#173f45"/>
    <path d="M13 18h22v14H13zM18 13h12M18 37h12M11 23h-3v5h3M37 23h3v5h-3" fill="none" stroke="#d6eee3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="19" cy="25" r="1.5" fill="#77c6a5"/><circle cx="25" cy="25" r="1.5" fill="#77c6a5"/><circle cx="31" cy="25" r="1.5" fill="#77c6a5"/>
  </g>
  <text x="136" y="68" class="eyebrow">LOCAL DEVELOPMENT ENVIRONMENT</text>
  <text x="136" y="108" class="title">Universal Local Dev Infrastructure Stack</text>
  <text x="136" y="137" class="subtitle">A persistent, multi-cloud playground powered by Docker Compose</text>
  <g transform="translate(1370 68)">
    <rect width="235" height="42" rx="21" fill="#e1eee8" stroke="#c9ddd3"/>
    <circle cx="22" cy="21" r="5" fill="#399574"/>
    <text x="38" y="26" font-size="12" font-weight="700" fill="#315d50">ONE SHARED NETWORK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="177" width="1536" height="914" rx="24" fill="url(#network)" stroke="#c7d8d3" stroke-width="1.5"/>
  </g>
  <g transform="translate(98 196)">
    <rect width="172" height="30" rx="15" fill="#e7f1ec"/>
    <circle cx="17" cy="15" r="4" fill="#3f9b77"/>
    <text x="30" y="19" font-size="11" font-weight="700" fill="#376b57">DOCKER COMPOSE</text>
  </g>
  <text x="1580" y="216" text-anchor="end" class="mono">external network: dev-network</text>

  <!-- App and developer entry points -->
  <g>
    <rect x="103" y="250" width="230" height="93" rx="13" fill="#183f46"/>
    <g transform="translate(122 270)" fill="none" stroke="#bce5d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 8h26v20H0zM6 3h26v20M7 14h5m4 0h5m-14 6h10"/>
    </g>
    <text x="169" y="282" font-size="15" font-weight="700" fill="#fff">Your app &amp; tools</text>
    <text x="169" y="305" font-size="11" fill="#c5d9d6">SDKs · CLIs · IDEs · test suites</text>
    <text x="169" y="324" font-size="10" fill="#94b7b1">Connect from host or container</text>
    <path d="M333 297H390" stroke="#6f9c91" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1358" y="250" width="218" height="93" rx="13" fill="#eff4f2" stroke="#d9e5e1"/>
    <g transform="translate(1378 270)" fill="none" stroke="#458b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="1" width="29" height="22" rx="3"/><path d="M0 7h29M5 4h1m4 0h1m4 0h1M10 29h10M15 23v6"/>
    </g>
    <text x="1420" y="282" font-size="14" font-weight="700">Host machine</text>
    <text x="1420" y="304" class="detail">localhost ports expose</text>
    <text x="1420" y="321" class="detail">services &amp; web consoles</text>
    <path d="M1337 297h-57" stroke="#6f9c91" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f9c91"/></marker>
  </defs>

  <!-- Service group panels -->
  <g>
    <rect x="103" y="375" width="442" height="298" rx="16" fill="#f0f7f3" stroke="#d8e8df"/>
    <rect x="565" y="375" width="442" height="298" rx="16" fill="#f0f5f8" stroke="#d8e2e9"/>
    <rect x="1027" y="375" width="549" height="298" rx="16" fill="#fbf5ec" stroke="#ecdfcd"/>
    <rect x="103" y="693" width="442" height="265" rx="16" fill="#f8f3f0" stroke="#eadfd7"/>
    <rect x="565" y="693" width="442" height="265" rx="16" fill="#f1f4f8" stroke="#dce3ec"/>
    <rect x="1027" y="693" width="549" height="265" rx="16" fill="#f2f7f5" stroke="#dbe8e2"/>
  </g>

  <!-- Databases -->
  <g>
    <circle cx="128" cy="405" r="10" fill="#3c8a65"/><path d="M123 403c0-3 10-3 10 0v6c0 3-10 3-10 0zM123 403c0 3 10 3 10 0" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="147" y="410" class="group-title" fill="#326b50">DATABASES &amp; CACHE</text>
    <g>
      <rect x="119" y="429" width="195" height="58" rx="9" class="node"/><rect x="119" y="429" width="4" height="58" rx="2" fill="#397d62"/>
      <text x="136" y="452" class="service">PostgreSQL 16 + pgvector</text><text x="136" y="472" class="mono">5432</text>
      <rect x="329" y="429" width="195" height="58" rx="9" class="node"/><rect x="329" y="429" width="4" height="58" rx="2" fill="#547e9d"/>
      <text x="346" y="452" class="service">SQL Server 2022</text><text x="346" y="472" class="mono">1433</text>
      <rect x="119" y="500" width="195" height="58" rx="9" class="node"/><rect x="119" y="500" width="4" height="58" rx="2" fill="#4e9b75"/>
      <text x="136" y="523" class="service">MongoDB 7</text><text x="136" y="543" class="mono">27017</text>
      <rect x="329" y="500" width="195" height="58" rx="9" class="node"/><rect x="329" y="500" width="4" height="58" rx="2" fill="#a27742"/>
      <text x="346" y="523" class="service">MariaDB 11</text><text x="346" y="543" class="mono">3306</text>
      <rect x="119" y="571" width="195" height="58" rx="9" class="node"/><rect x="119" y="571" width="4" height="58" rx="2" fill="#397d62"/>
      <text x="136" y="594" class="service">Cosmos DB Emulator</text><text x="136" y="614" class="mono">8081 · 10251–10255</text>
      <rect x="329" y="571" width="195" height="58" rx="9" class="node"/><rect x="329" y="571" width="4" height="58" rx="2" fill="#b14e49"/>
      <text x="346" y="594" class="service">Redis 7</text><text x="346" y="614" class="mono">6379</text>
    </g>
  </g>

  <!-- Cloud emulators -->
  <g>
    <circle cx="590" cy="405" r="10" fill="#477da0"/><path d="M585 407h10a3 3 0 0 0 0-6 4 4 0 0 0-8-1 3 3 0 0 0-2 7z" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="609" y="410" class="group-title" fill="#416f8b">CLOUD EMULATORS</text>
    <g>
      <rect x="581" y="429" width="195" height="58" rx="9" class="node"/><rect x="581" y="429" width="4" height="58" rx="2" fill="#ae7840"/>
      <text x="598" y="452" class="service">AWS LocalStack</text><text x="598" y="472" class="mono">4566 · 4510–4559</text>
      <rect x="791" y="429" width="195" height="58" rx="9" class="node"/><rect x="791" y="429" width="4" height="58" rx="2" fill="#397d9a"/>
      <text x="808" y="452" class="service">Azure Storage · Azurite</text><text x="808" y="472" class="mono">10000 · 10001 · 10002</text>
      <rect x="581" y="500" width="195" height="58" rx="9" class="node"/><rect x="581" y="500" width="4" height="58" rx="2" fill="#4a77aa"/>
      <text x="598" y="523" class="service">GCP Pub/Sub</text><text x="598" y="543" class="mono">8085</text>
      <rect x="791" y="500" width="195" height="58" rx="9" class="node"/><rect x="791" y="500" width="4" height="58" rx="2" fill="#547e9d"/>
      <text x="808" y="523" class="service">GCP Firestore</text><text x="808" y="543" class="mono">8090</text>
      <rect x="581" y="571" width="405" height="58" rx="9" class="node"/><rect x="581" y="571" width="4" height="58" rx="2" fill="#4a77aa"/>
      <text x="598" y="594" class="service">GCP Datastore Emulator</text><text x="598" y="614" class="mono">8095 · project: dev-project</text>
    </g>
  </g>

  <!-- Messaging -->
  <g>
    <circle cx="1052" cy="405" r="10" fill="#b17b3e"/><path d="M1046 402h12v8h-12zM1046 402l6 5 6-5" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="1071" y="410" class="group-title" fill="#8c622f">MESSAGING, STREAMING &amp; IDENTITY</text>
    <g>
      <rect x="1043" y="429" width="244" height="82" rx="9" class="node"/><rect x="1043" y="429" width="4" height="82" rx="2" fill="#b17b3e"/>
      <text x="1060" y="452" class="service">Apache Kafka · 2 brokers</text><text x="1060" y="472" class="mono">9092 · 9093</text><text x="1060" y="493" class="detail">KRaft quorum · Kafka UI on 8082</text>
      <rect x="1301" y="429" width="249" height="82" rx="9" class="node"/><rect x="1301" y="429" width="4" height="82" rx="2" fill="#b14e49"/>
      <text x="1318" y="452" class="service">RabbitMQ · 3 nodes</text><text x="1318" y="472" class="mono">5672 · 5673 · 5674</text><text x="1318" y="493" class="detail">Management console on 15672</text>
      <rect x="1043" y="524" width="244" height="82" rx="9" class="node"/><rect x="1043" y="524" width="4" height="82" rx="2" fill="#6a8d64"/>
      <text x="1060" y="547" class="service">Mailpit</text><text x="1060" y="567" class="mono">SMTP 1025 · Web UI 8025</text><text x="1060" y="588" class="detail">Local email capture &amp; preview</text>
      <rect x="1301" y="524" width="249" height="82" rx="9" class="node"/><rect x="1301" y="524" width="4" height="82" rx="2" fill="#6c718f"/>
      <text x="1318" y="547" class="service">Keycloak</text><text x="1318" y="567" class="mono">8089</text><text x="1318" y="588" class="detail">Local identity &amp; access testing</text>
    </g>
    <text x="1044" y="638" class="tiny">Cluster members share the same Compose network and persistent data.</text>
  </g>

  <!-- Observability -->
  <g>
    <circle cx="128" cy="723" r="10" fill="#bc6d52"/><path d="M122 724h3l2-5 3 10 2-5h3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="147" y="728" class="group-title" fill="#92543f">OBSERVABILITY &amp; CODE QUALITY</text>
    <g>
      <rect x="119" y="747" width="195" height="76" rx="9" class="node"/><rect x="119" y="747" width="4" height="76" rx="2" fill="#bc6d52"/>
      <text x="136" y="771" class="service">OpenTelemetry Collector</text><text x="136" y="791" class="mono">OTLP 4317 · 4318</text><text x="136" y="809" class="detail">Metrics exporter 8889</text>
      <rect x="329" y="747" width="195" height="76" rx="9" class="node"/><rect x="329" y="747" width="4" height="76" rx="2" fill="#537fa0"/>
      <text x="346" y="771" class="service">Jaeger</text><text x="346" y="791" class="mono">UI 16686</text><text x="346" y="809" class="detail">Distributed trace explorer</text>
      <rect x="119" y="839" width="195" height="76" rx="9" class="node"/><rect x="119" y="839" width="4" height="76" rx="2" fill="#d17b44"/>
      <text x="136" y="863" class="service">Prometheus</text><text x="136" y="883" class="mono">UI 9091</text><text x="136" y="901" class="detail">Scrape &amp; query metrics</text>
      <rect x="329" y="839" width="195" height="76" rx="9" class="node"/><rect x="329" y="839" width="4" height="76" rx="2" fill="#c56d46"/>
      <text x="346" y="863" class="service">Grafana</text><text x="346" y="883" class="mono">UI 3000</text><text x="346" y="901" class="detail">Metrics dashboards</text>
    </g>
  </g>

  <!-- Management UIs -->
  <g>
    <circle cx="590" cy="723" r="10" fill="#687e9d"/><path d="M585 719h10v8h-10zM585 722h10M588 717h4" fill="none" stroke="#fff" stroke-width="1.2"/>
    <text x="609" y="728" class="group-title" fill="#536986">MANAGEMENT CONSOLES</text>
    <g>
      <rect x="581" y="747" width="195" height="58" rx="9" class="node"/><rect x="581" y="747" width="4" height="58" rx="2" fill="#547e9d"/>
      <text x="598" y="770" class="service">Adminer</text><text x="598" y="790" class="mono">localhost:8088</text>
      <rect x="791" y="747" width="195" height="58" rx="9" class="node"/><rect x="791" y="747" width="4" height="58" rx="2" fill="#397d62"/>
      <text x="808" y="770" class="service">pgAdmin</text><text x="808" y="790" class="mono">localhost:5050</text>
      <rect x="581" y="819" width="195" height="58" rx="9" class="node"/><rect x="581" y="819" width="4" height="58" rx="2" fill="#b14e49"/>
      <text x="598" y="842" class="service">Redis Insight</text><text x="598" y="862" class="mono">localhost:5540</text>
      <rect x="791" y="819" width="195" height="58" rx="9" class="node"/><rect x="791" y="819" width="4" height="58" rx="2" fill="#b17b3e"/>
      <text x="808" y="842" class="service">SonarQube</text><text x="808" y="862" class="mono">localhost:9000</text>
      <rect x="581" y="891" width="405" height="43" rx="9" fill="#e7edf3" stroke="#d6e0ea"/>
      <text x="598" y="917" font-size="11" font-weight="650" fill="#536986">Also: Kafka UI 8082 · RabbitMQ Management 15672</text>
    </g>
  </g>

  <!-- Connectivity key and persistence -->
  <g>
    <circle cx="1052" cy="723" r="10" fill="#438970"/><path d="M1047 724l3 3 7-8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1071" y="728" class="group-title" fill="#376d59">PERSISTENCE &amp; CONNECTIVITY</text>
    <rect x="1043" y="747" width="507" height="91" rx="10" fill="#fff" stroke="#dce7e2"/>
    <g transform="translate(1062 770)" fill="none" stroke="#438970" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 5l15-7 15 7-15 7zM0 13l15 7 15-7M0 21l15 7 15-7"/>
    </g>
    <text x="1110" y="775" class="service">Named local data directories</text>
    <text x="1110" y="797" class="detail">${DATA_DIR} mounts preserve databases, broker state,</text>
    <text x="1110" y="815" class="detail">emulator data and dashboards across container restarts.</text>
    <rect x="1043" y="851" width="507" height="83" rx="10" fill="#fff" stroke="#dce7e2"/>
    <g transform="translate(1063 873)" fill="none" stroke="#438970" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="8" r="4"/><circle cx="25" cy="8" r="4"/><circle cx="15" cy="25" r="4"/><path d="M9 10l4 11m8-11l-4 11M9 8h12"/>
    </g>
    <text x="1110" y="879" class="service">Shared service discovery</text>
    <text x="1110" y="901" class="detail">Containers resolve one another by Compose service name</text>
    <text x="1110" y="919" class="detail">on the external <tspan font-family="Consolas" font-weight="700">dev-network</tspan>; host ports are for local clients.</text>
  </g>

  <path d="M103 982H1576" stroke="#dce6e3" stroke-width="1"/>
  <g transform="translate(103 1008)">
    <circle cx="7" cy="7" r="5" fill="#3f9b77"/>
    <text x="22" y="11" font-size="11" fill="#587078">Container-to-container traffic stays inside <tspan font-family="Consolas" font-weight="700">dev-network</tspan></text>
    <circle cx="440" cy="7" r="5" fill="#547e9d"/>
    <text x="455" y="11" font-size="11" fill="#587078">Published ports are reachable from the host</text>
    <circle cx="831" cy="7" r="5" fill="#b17b3e"/>
    <text x="846" y="11" font-size="11" fill="#587078">Persistent mounts use <tspan font-family="Consolas" font-weight="700">${DATA_DIR}</tspan></text>
    <text x="1470" y="11" text-anchor="end" class="tiny">Docker Compose · local-first · multi-cloud</text>
  </g>
  <text x="103" y="1060" class="tiny">Launch: <tspan font-family="Consolas" font-weight="700">docker compose -f local-containers.yml --profile "*" up -d</tspan></text>
</svg>