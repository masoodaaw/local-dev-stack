apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api
  namespace: landscape-lab
  labels: {app.kubernetes.io/part-of: landscape-lab}
spec:
  serviceName: api-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, app.kubernetes.io/part-of: landscape-lab}
    spec:
      serviceAccountName: landscape-controller
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/part-of: landscape-lab}}
      containers:
        - name: api
          image: node:22-alpine
          command: ["node", "/app/app.js"]
          env:
            - {name: ROLE, value: api}
            - {name: SHARED_DIR, value: /shared}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 5}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: 500m, memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: shared, mountPath: /shared, readOnly: true}
      volumes:
        - {name: app, configMap: {name: landscape-app}}
        - name: shared
          hostPath: {path: /shared, type: Directory}
---
