apiVersion: v1
kind: Namespace
metadata:
  name: landscape-lab
  labels:
    app.kubernetes.io/part-of: landscape-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: landscape-controller
  namespace: landscape-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: landscape-controller
  namespace: landscape-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["database-0"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["database", "traffic"]
    verbs: ["patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: landscape-controller
  namespace: landscape-lab
subjects:
  - kind: ServiceAccount
    name: landscape-controller
    namespace: landscape-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: landscape-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landscape-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: landscape-node-reader
subjects:
  - kind: ServiceAccount
    name: landscape-controller
    namespace: landscape-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: landscape-node-reader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: landscape-lab
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: landscape-lab
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - podSelector:
            matchLabels: {app: traffic}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loadbalancer-ingress
  namespace: landscape-lab
spec:
  podSelector:
    matchLabels: {app: loadbalancer}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {app: gateway}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cdn-ingress
  namespace: landscape-lab
spec:
  podSelector:
    matchLabels: {app: cdn}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {app: loadbalancer}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-ingress
  namespace: landscape-lab
spec:
  podSelector:
    matchLabels: {app: ui}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: cdn}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: landscape-lab
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: ui}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: landscape-lab
spec:
  podSelector:
    matchLabels: {app: database}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {app: database}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: v1
