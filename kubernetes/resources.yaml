metadata:
  name: traffic
  namespace: landscape-lab
  labels: {app.kubernetes.io/part-of: landscape-lab}
spec:
  serviceName: traffic-headless
  replicas: 0
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: traffic}
  template:
    metadata:
      labels: {app: traffic, app.kubernetes.io/part-of: landscape-lab}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/part-of: landscape-lab}}
      containers:
        - name: traffic
          image: node:22-alpine
          command: ["node", "/app/app.js"]
          env:
            - {name: ROLE, value: traffic}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 250m, memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
      volumes: [{name: app, configMap: {name: landscape-app}}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: landscape-lab
  labels: {app.kubernetes.io/part-of: landscape-lab}
spec:
  serviceName: database
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: database}
  template:
    metadata:
      labels: {app: database, app.kubernetes.io/part-of: landscape-lab}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/part-of: landscape-lab}}
      containers:
        - name: database
          image: node:22-alpine
          command: ["node", "/app/app.js"]
          env:
            - {name: ROLE, value: database}
            - {name: DATA_DIR, value: /data}
            - {name: SHARED_DIR, value: /shared}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 48Mi}, limits: {cpu: 250m, memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: shared, mountPath: /shared}
      volumes:
        - {name: app, configMap: {name: landscape-app}}
        - name: shared
          hostPath: {path: /shared, type: Directory}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 256Mi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: landscape-lab
  labels: {app.kubernetes.io/part-of: landscape-lab}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: gateway}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
