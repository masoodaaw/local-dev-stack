  app.js: "'use strict';\r\n\r\nconst http = require('node:http');\r\nconst https = require('node:https');\r\nconst fs = require('node:fs');\r\nconst path = require('node:path');\r\nconst dns = require('node:dns');\r\nconst crypto = require('node:crypto');\r\nconst { isSameOriginMutation, isLabPod } = require('./security');\r\n\r\nconst role = process.env.ROLE || 'ui';\r\nconst port = Number(process.env.PORT || 8080);\r\nconst namespace = 'landscape-lab';\r\nconst label = encodeURIComponent('app.kubernetes.io/part-of=landscape-lab');\r\nconst serviceAccount = '/var/run/secrets/kubernetes.io/serviceaccount';\r\nconst podName = process.env.HOSTNAME || 'local';\r\nconst sharedDirectory = process.env.SHARED_DIR || '/shared';\r\nconst dataDirectory = process.env.DATA_DIR || '/data';\r\nconst componentTimeout = Number(process.env.UPSTREAM_TIMEOUT_MS || 20000);\r\nconst hopByHop = new Set(['connection', 'keep-alive', 'proxy-authenticate', 'proxy-authorization', 'te', 'trailer', 'transfer-encoding', 'upgrade']);\r\n\r\nlet workCalls = 0;\r\n\r\nfunction send(response, status, value, type = 'application/json; charset=utf-8', headers = {}) {\r\n  response.writeHead(status, {\r\n    'content-type': type,\r\n    'cache-control': 'no-store',\r\n    'x-content-type-options': 'nosniff',\r\n    'x-served-by': `${role}/${podName}`,\r\n    ...headers\r\n  });\r\n  response.end(typeof value === 'string' || Buffer.isBuffer(value) ? value : JSON.stringify(value));\r\n}\r\n\r\nfunction request(options, body) {\r\n  return new Promise((resolve, reject) => {\r\n    const transport = options.protocol === 'https:' ? https : http;\r\n    const outgoing = transport.request({ timeout: componentTimeout, ...options }, incoming => {\r\n      const chunks = [];\r\n      let size = 0;\r\n      incoming.on('data', chunk => {\r\n        size += chunk.length;\r\n        if (size > 4000000) outgoing.destroy(new Error('Response too large'));\r\n        else chunks.push(chunk);\r\n      });\r\n      incoming.on('end', () => resolve({ status: incoming.statusCode, data: Buffer.concat(chunks).toString('utf8'), headers: incoming.headers }));\r\n    });\r\n    outgoing.on('timeout', () => outgoing.destroy(new Error('Request timed out')));\r\n    outgoing.on('error', reject);\r\n    if (body !== undefined) outgoing.write(body);\r\n    outgoing.end();\r\n  });\r\n}\r\n\r\nasync function kube(target, method = 'GET', body) {\r\n  const token = fs.readFileSync(`${serviceAccount}/token`, 'utf8');\r\n  const ca = fs.readFileSync(`${serviceAccount}/ca.crt`);\r\n  const result = await request({\r\n    protocol: 'https:',\r\n    hostname: process.env.KUBERNETES_SERVICE_HOST,\r\n    port: process.env.KUBERNETES_SERVICE_PORT || 443,\r\n    path: target,\r\n    method,\r\n    ca,\r\n    headers: { authorization: `Bearer ${token}`, ...(body ? { 'content-type': 'application/merge-patch+json' } : {}) }\r\n  }, body && JSON.stringify(body));\r\n  if (result.status < 200 || result.status >= 300) throw new Error(`Kubernetes API ${result.status}: ${result.data.slice(0, 300)}`);\r\n  return JSON.parse(result.data);\r\n}\r\n\r\nasync function internal(hostname, target, method = 'GET', headers = {}, body, timeout = 8000) {\r\n  return request({ protocol: 'http:', hostname, port: 8080, path: target, method, headers, timeout }, body);\r\n}\r\n\r\nasync function readBody(requestObject, limit = 65536) {\r\n  const chunks = [];\r\n  let size = 0;\r\n  for await (const chunk of requestObject) {\r\n    size += chunk.length;\r\n    if (size > limit) throw new Error('Request body too large');\r\n    chunks.push(Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk));\r\n  }\r\n  return Buffer.concat(chunks);\r\n}\r\n\r\nfunction spendCpu() {\r\n  crypto.pbkdf2Sync('landscape-lab', 'bounded-work', 20000, 32, 'sha256');\r\n}\r\n\r\nfunction createStats() {\r\n  const startedAt = Date.now();\r\n  const latencies = [];\r\n  const seconds = new Map();\r\n  let total = 0;\r\n  let inFlight = 0;\r\n  let errors = 0;\r\n  return {\r\n    begin() {\r\n      total += 1;\r\n      inFlight += 1;\r\n      const second = Math.floor(Date.now() / 1000);\r\n      seconds.set(second, (seconds.get(second) || 0) + 1);\r\n      if (seconds.size > 130) for (const key of seconds.keys()) if (key < second - 120) seconds.delete(key);\r\n    },\r\n    end(milliseconds, ok) {\r\n      inFlight = Math.max(0, inFlight - 1);\r\n      if (!ok) errors += 1;\r\n      latencies.push(milliseconds);\r\n      if (latencies.length > 200) latencies.shift();\r\n    },\r\n    snapshot() {\r\n      const now = Math.floor(Date.now() / 1000);\r\n      let recent = 0;\r\n      for (const [second, count] of seconds) if (second > now - 5) recent += count;\r\n      const sorted = [...latencies].sort((left, right) => left - right);\r\n      return {\r\n        pod: podName,\r\n        totalRequests: total,\r\n        inFlight,\r\n        errors,\r\n        requestsPerSecond: Math.round((recent / 5) * 10) / 10,\r\n        latencyP95Ms: sorted.length ? sorted[Math.floor(sorted.length * 0.95)] : 0,\r\n        uptimeSeconds: Math.floor((Date.now() - startedAt) / 1000)\r\n      };\r\n    }\r\n  };\r\n}\r\n\r\nasync function relay(requestObject, options) {\r\n  const body = requestObject.method === 'GET' || requestObject.method === 'HEAD' ? undefined : await readBody(requestObject);\r\n  const headers = {};\r\n  for (const [name, value] of Object.entries(requestObject.headers)) {\r\n    if (!hopByHop.has(name) && value !== undefined) headers[name] = value;\r\n  }\r\n  return request({\r\n    protocol: 'http:',\r\n    hostname: options.hostname,\r\n    port: options.port || 8080,\r\n    path: requestObject.url,\r\n    method: requestObject.method,\r\n    headers,\r\n    timeout: options.timeout || componentTimeout\r\n  }, body);\r\n}\r\n\r\nasync function proxy(requestObject, response, stats, options) {\r\n  stats.begin();\r\n  const startedAt = Date.now();\r\n  let ok = false;\r\n  try {\r\n    const result = await relay(requestObject, options);\r\n    ok = result.status < 500;\r\n    send(response, result.status, result.data, result.headers['content-type'] || 'application/octet-stream', {\r\n      'cache-control': result.headers['cache-control'] || 'no-store',\r\n      'x-cdn-cache': result.headers['x-cdn-cache'] || 'BYPASS'\r\n    });\r\n    return result.status;\r\n  } catch (error) {\r\n    send(response, 502, { error: `Upstream ${options.hostname} unavailable: ${error.message}` });\r\n    return 502;\r\n  } finally {\r\n    stats.end(Date.now() - startedAt, ok);\r\n  }\r\n}\r\n\r\nfunction createGateway(stats) {\r\n  return (requestObject, response) => {\r\n    const target = new URL(requestObject.url, 'http://lab').pathname;\r\n    if (target === '/health') return send(response, 200, { ok: true, role, pod: podName });\r\n    if (target === '/_gateway/stats') return send(response, 200, { role: 'gateway', upstream: 'loadbalancer', ...stats.snapshot() });\r\n    return proxy(requestObject, response, stats, { hostname: 'loadbalancer' });\r\n  };\r\n}\r\n\r\nasync function resolveBackends(service) {\r\n  try {\r\n    const records = await dns.promises.resolveSrv(`_http._tcp.${service}.${namespace}.svc.cluster.local`);\r\n    if (records.length) return records.map(record => ({ hostname: record.name.replace(/\\.$/, ''), port: record.port }));\r\n  } catch {}\r\n  return [{ hostname: service, port: 8080 }];\r\n}\r\n\r\nfunction createLoadBalancer(stats) {\r\n  let backends = [];\r\n  let refreshedAt = 0;\r\n  let cursor = 0;\r\n  const usage = new Map();\r\n  async function pool() {\r\n    if (!backends.length || Date.now() - refreshedAt > 5000) {\r\n      backends = await resolveBackends('cdn-headless');\r\n      refreshedAt = Date.now();\r\n    }\r\n    return backends;\r\n  }\r\n  return async (requestObject, response) => {\r\n    const target = new URL(requestObject.url, 'http://lab').pathname;\r\n    if (target === '/health') return send(response, 200, { ok: true, role, pod: podName });\r\n    if (target === '/_lb/stats') {\r\n      const available = await pool();\r\n      return send(response, 200, {\r\n        role: 'loadbalancer',\r\n        algorithm: 'round-robin',\r\n        backends: available.map(item => item.hostname),\r\n        distribution: [...usage.entries()].map(([hostname, requests]) => ({ pod: hostname, requests })),\r\n        ...stats.snapshot()\r\n      });\r\n    }\r\n    const available = await pool();\r\n    const backend = available[cursor++ % available.length];\r\n    usage.set(backend.hostname, (usage.get(backend.hostname) || 0) + 1);\r\n    const status = await proxy(requestObject, response, stats, { hostname: backend.hostname, port: backend.port });\r\n    if (status === 502) {\r\n      backends = [];\r\n      refreshedAt = 0;\r\n    }\r\n    return status;\r\n  };\r\n}\r\n\r\nfunction createCdn(stats) {\r\n  const cache = new Map();\r\n  const ttl = 15000;\r\n  let hits = 0;\r\n  let misses = 0;\r\n  let bytesSaved = 0;\r\n  return async (requestObject, response) => {\r\n    const target = new URL(requestObject.url, 'http://lab').pathname;\r\n    if (target === '/health') return send(response, 200, { ok: true, role, pod: podName });\r\n    if (target === '/_cdn/stats') {\r\n      const lookups = hits + misses;\r\n      return send(response, 200, {\r\n        role: 'cdn',\r\n        ttlSeconds: ttl / 1000,\r\n        entries: cache.size,\r\n        hits,\r\n        misses,\r\n        hitRatio: lookups ? Math.round((hits / lookups) * 100) : 0,\r\n        bytesSaved,\r\n        ...stats.snapshot()\r\n      });\r\n    }\r\n    const cacheable = requestObject.method === 'GET' && !target.startsWith('/api/') && target !== '/work' && !target.startsWith('/_');\r\n    if (cacheable) {\r\n      const entry = cache.get(requestObject.url);\r\n      if (entry && entry.expires > Date.now()) {\r\n        hits += 1;\r\n        bytesSaved += entry.size;\r\n        send(response, 200, entry.data, entry.type, { 'cache-control': 'no-store', 'x-cdn-cache': 'HIT' });\r\n        return 200;\r\n      }\r\n      misses += 1;\r\n    }\r\n    stats.begin();\r\n    const startedAt = Date.now();\r\n    let ok = false;\r\n    try {\r\n      const result = await relay(requestObject, { hostname: 'ui' });\r\n      ok = result.status < 500;\r\n      const type = result.headers['content-type'] || 'application/octet-stream';\r\n      if (cacheable && result.status === 200) {\r\n        cache.set(requestObject.url, { data: result.data, type, expires: Date.now() + ttl, size: Buffer.byteLength(result.data) });\r\n        if (cache.size > 50) cache.delete(cache.keys().next().value);\r\n      }\r\n      send(response, result.status, result.data, type, { 'cache-control': 'no-store', 'x-cdn-cache': 'MISS' });\r\n      return result.status;\r\n    } catch (error) {\r\n      send(response, 502, { error: `UI unavailable: ${error.message}` });\r\n      return 502;\r\n    } finally {\r\n      stats.end(Date.now() - startedAt, ok);\r\n    }\r\n  };\r\n}\r\n\r\nfunction createUi() {\r\n  const assets = {\r\n    '/': ['index.html', 'text/html; charset=utf-8'],\r\n    '/index.html': ['index.html', 'text/html; charset=utf-8'],\r\n    '/app.css': ['app.css', 'text/css; charset=utf-8'],\r\n    '/browser.js': ['browser.js', 'text/javascript; charset=utf-8'],\r\n    '/architecture.svg': ['architecture.svg', 'image/svg+xml; charset=utf-8']\r\n  };\r\n  return async (requestObject, response) => {\r\n    const target = new URL(requestObject.url, 'http://lab').pathname;\r\n    if (target === '/health') return send(response, 200, { ok: true, role, pod: podName });\r\n    if (requestObject.method === 'GET' && assets[target]) {\r\n      const [file, type] = assets[target];\r\n      return send(response, 200, fs.readFileSync(path.join('/app', file)), type, { 'cache-control': 'no-store' });\r\n    }\r\n    try {\r\n      const body = requestObject.method === 'GET' || requestObject.method === 'HEAD' ? undefined : await readBody(requestObject);\r\n      const result = await internal('api', requestObject.url, requestObject.method, {\r\n        host: requestObject.headers.host || '',\r\n        origin: requestObject.headers.origin || '',\r\n        'content-type': requestObject.headers['content-type'] || ''\r\n      }, body, target === '/api/status' ? 20000 : 8000);\r\n      send(response, result.status, result.data, result.headers['content-type'] || 'application/json; charset=utf-8');\r\n      return result.status;\r\n    } catch (error) {\r\n      send(response, 502, { error: `API unavailable: ${error.message}` });\r\n      return 502;\r\n    }\r\n  };\r\n}\r\n\r\nfunction readShared(name, fallback) {\r\n  try {\r\n    const parsed = JSON.parse(fs.readFileSync(path.join(sharedDirectory, name), 'utf8'));\r\n    return parsed && typeof parsed === 'object' ? parsed : fallback;\r\n  } catch {\r\n    return fallback;\r\n  }\r\n}\r\n\r\nfunction primaryName() {\r\n  const marker = readShared('primary.json', { primary: 'database-0' });\r\n  return typeof marker.primary === 'string' ? marker.primary : 'database-0';\r\n}\r\n\r\nfunction listBackups() {\r\n  const directory = path.join(sharedDirectory, 'backups');\r\n  let names = [];\r\n  try {\r\n    names = fs.readdirSync(directory).filter(name => name.endsWith('.json') && name !== 'latest.json').sort();\r\n  } catch {}\r\n  return { count: names.length, latest: names.length ? names[names.length - 1] : null };\r\n}\r\n\r\nasync function promoteReplica(current, clients = {}) {\r\n  const kubeClient = clients.kube || kube;\r\n  const internalClient = clients.internal || internal;\r\n  let pods;\r\n  try {\r\n    pods = await kubeClient(`/api/v1/namespaces/${namespace}/pods?labelSelector=${label}`);\r\n  } catch {\r\n    return null;\r\n  }\r\n  const candidates = (pods.items || []).filter(pod => /^database-/.test(pod.metadata.name) && pod.metadata.name !== current && pod.status?.phase === 'Running' && (pod.status.containerStatuses || []).some(item => item.name === 'database' && item.ready));\r\n  for (const pod of candidates) {\r\n    try {\r\n      const result = await internalClient(`${pod.metadata.name}.database`, '/promote', 'POST', {}, undefined, 4000);\r\n      if (result.status === 200) return pod.metadata.name;\r\n    } catch {}\r\n  }\r\n  return null;\r\n}\r\n\r\nasync function dbRequest(target, method = 'GET', attempt = 0, clients = {}) {\r\n  const internalClient = clients.internal || internal;\r\n  const active = primaryName();\r\n  try {\r\n    const result = await internalClient(`${active}.database`, target, method, {}, undefined, 5000);\r\n    if (result.status < 200 || result.status >= 300) {\r\n      const error = new Error(`Database HTTP ${result.status}: ${result.data.slice(0, 200)}`);\r\n      error.status = result.status;\r\n      throw error;\r\n    }\r\n    return { data: JSON.parse(result.data), pod: active, failover: attempt > 0 };\r\n  } catch (error) {\r\n    if (attempt > 0 || error.status === 409) throw error;\r\n    const promoted = await promoteReplica(active, clients);\r\n    if (!promoted) throw error;\r\n    return dbRequest(target, method, attempt + 1, clients);\r\n  }\r\n}\r\n\r\nasync function componentStats(hostname, target, client = internal) {\r\n  const result = await client(hostname, target, 'GET', {}, undefined, 4000);\r\n  if (result.status !== 200) throw new Error(`${hostname} HTTP ${result.status}`);\r\n  return JSON.parse(result.data);\r\n}\r\n\r\nasync function collectStatus(clients = {}) {\r\n  const kubeClient = clients.kube || kube;\r\n  const internalClient = clients.internal || internal;\r\n  const apps = `/apis/apps/v1/namespaces/${namespace}`;\r\n  const core = `/api/v1/namespaces/${namespace}`;\r\n  const tasks = {\r\n    statefulsets: () => kubeClient(`${apps}/statefulsets?labelSelector=${label}`),\r\n    nodes: async () => {\r\n      const data = await kubeClient('/api/v1/nodes');\r\n      return {\r\n        items: (data.items || []).map(node => ({\r\n          name: node.metadata.name,\r\n          roles: Object.keys(node.metadata.labels || {})\r\n            .filter(key => key.startsWith('node-role.kubernetes.io/'))\r\n            .map(key => key.slice('node-role.kubernetes.io/'.length))\r\n            .sort(),\r\n          taints: (node.spec?.taints || []).map(taint => ({ key: taint.key, value: taint.value || '', effect: taint.effect })),\r\n          unschedulable: Boolean(node.spec?.unschedulable)\r\n        }))\r\n      };\r\n    },\r\n    pods: () => kubeClient(`${core}/pods?labelSelector=${label}`),\r\n    hpas: () => kubeClient(`/apis/autoscaling/v2/namespaces/${namespace}/horizontalpodautoscalers?labelSelector=${label}`),\r\n    metrics: () => kubeClient(`/apis/metrics.k8s.io/v1beta1/namespaces/${namespace}/pods?labelSelector=${label}`),\r\n    events: async () => {\r\n      const data = await kubeClient(`${core}/events?limit=60`);\r\n      data.items = data.items\r\n        .filter(event => !event.involvedObject?.name || isLabPod(event.involvedObject.name) || event.involvedObject.name === 'database' || event.involvedObject.name === 'traffic')\r\n        .sort((left, right) => String(right.lastTimestamp || right.eventTime || '').localeCompare(String(left.lastTimestamp || left.eventTime || '')))\r\n        .slice(0, 12);\r\n      return data;\r\n    },\r\n    gateway: () => componentStats('gateway', '/_gateway/stats', internalClient),\r\n    loadbalancer: () => componentStats('loadbalancer', '/_lb/stats', internalClient),\r\n    cdn: () => componentStats('cdn', '/_cdn/stats', internalClient),\r\n    database: async () => {\r\n      const result = await dbRequest('/state', 'GET', 0, { internal: internalClient });\r\n      return { ...result.data, activePod: result.pod, failover: result.failover };\r\n    },\r\n    backups: () => listBackups()\r\n  };\r\n  const entries = await Promise.all(Object.entries(tasks).map(async ([name, task]) => {\r\n    try {\r\n      return [name, { data: await task() }];\r\n    } catch (error) {\r\n      return [name, { error: error.message }];\r\n    }\r\n  }));\r\n  const result = Object.fromEntries(entries);\r\n  const counts = new Map();\r\n  let podsKnown = false;\r\n  if (result.pods.data) {\r\n    podsKnown = true;\r\n    result.pods.data.items = result.pods.data.items.filter(pod => isLabPod(pod.metadata.name));\r\n    for (const pod of result.pods.data.items) {\r\n      const node = pod.spec?.nodeName;\r\n      if (node) counts.set(node, (counts.get(node) || 0) + 1);\r\n    }\r\n  }\r\n  if (result.nodes.data) {\r\n    result.nodes.data.items = result.nodes.data.items.map(node => ({\r\n      ...node,\r\n      podCount: podsKnown ? counts.get(node.name) || 0 : null\r\n    }));\r\n  }\r\n  return result;\r\n}\r\n\r\nconst controls = {\r\n  '/api/traffic': async (data, clients) => {\r\n    if (!data || !Number.isInteger(data.level) || data.level < 0 || data.level > 3) {\r\n      const error = new Error('level must be an integer between 0 and 3');\r\n      error.status = 400;\r\n      throw error;\r\n    }\r\n    await (clients.kube || kube)(`/apis/apps/v1/namespaces/${namespace}/statefulsets/traffic/scale`, 'PATCH', { spec: { replicas: data.level } });\r\n    return { level: data.level };\r\n  },\r\n  '/api/database/increment': async (data, clients) => {\r\n    const result = await dbRequest('/increment', 'POST', 0, clients);\r\n    return { ...result.data, activePod: result.pod };\r\n  },\r\n  '/api/database/backup': async (data, clients) => {\r\n    const result = await dbRequest('/backup', 'POST', 0, clients);\r\n    return result.data;\r\n  },\r\n  '/api/database/restore': async (data, clients) => {\r\n    const result = await dbRequest('/restore', 'POST', 0, clients);\r\n    return result.data;\r\n  },\r\n  '/api/database/failover': async () => {\r\n    await kube(`/api/v1/namespaces/${namespace}/pods/database-0`, 'DELETE');\r\n    return { message: 'Primary pod deletion requested. The API fails over to the replica and promotes it.' };\r\n  },\r\n  '/api/database/scale': async (data, clients) => {\r\n    if (!data || ![0, 2].includes(data.replicas)) {\r\n      const error = new Error('replicas must be 0 (disaster) or 2 (recover)');\r\n      error.status = 400;\r\n      throw error;\r\n    }\r\n    await (clients.kube || kube)(`/apis/apps/v1/namespaces/${namespace}/statefulsets/database/scale`, 'PATCH', { spec: { replicas: data.replicas } });\r\n    return { replicas: data.replicas };\r\n  }\r\n};\r\n\r\nasync function apiHandler(requestObject, response, clients = { kube, internal }) {\r\n  const target = new URL(requestObject.url, 'http://lab').pathname;\r\n  if (requestObject.method === 'GET' && target === '/health') return send(response, 200, { ok: true, role, pod: podName });\r\n  if (requestObject.method === 'GET' && target === '/work') {\r\n    spendCpu();\r\n    workCalls += 1;\r\n    if (workCalls % 20 === 0) dbRequest('/touch', 'POST', 0, clients).catch(() => {});\r\n    return send(response, 200, { ok: true });\r\n  }\r\n  if (requestObject.method === 'GET' && target === '/api/status') return send(response, 200, await collectStatus(clients));\r\n  const control = controls[target];\r\n  if (requestObject.method !== 'POST' || !control) return send(response, 404, { error: 'Not found' });\r\n  if (!isSameOriginMutation(requestObject)) return send(response, 403, { error: 'Same-origin JSON request required' });\r\n  let data;\r\n  try {\r\n    const body = await readBody(requestObject);\r\n    data = JSON.parse(body.toString('utf8') || '{}');\r\n  } catch {\r\n    return send(response, 400, { error: 'Invalid JSON body' });\r\n  }\r\n  try {\r\n    return send(response, 200, await control(data, clients));\r\n  } catch (error) {\r\n    return send(response, error.status || 503, { error: error.message });\r\n  }\r\n}\r\n\r\nfunction persistState(file, state) {\r\n  const temporary = `${file}.tmp`;\r\n  const descriptor = fs.openSync(temporary, 'w');\r\n  try {\r\n    fs.writeFileSync(descriptor, JSON.stringify(state));\r\n    fs.fsyncSync(descriptor);\r\n  } finally {\r\n    fs.closeSync(descriptor);\r\n  }\r\n  fs.renameSync(temporary, file);\r\n}\r\n\r\nfunction createDatabaseHandler(directory, options = {}) {\r\n  const shared = options.sharedDirectory || sharedDirectory;\r\n  const name = options.podName || podName;\r\n  const file = path.join(directory, 'state.json');\r\n  const markerFile = path.join(shared, 'primary.json');\r\n  fs.mkdirSync(directory, { recursive: true });\r\n\r\n  function load() {\r\n    try {\r\n      const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));\r\n      if (!Number.isSafeInteger(parsed.counter) || parsed.counter < 0) throw new Error('Invalid persisted database state');\r\n      return { counter: parsed.counter, touches: Number.isSafeInteger(parsed.touches) ? parsed.touches : 0 };\r\n    } catch (error) {\r\n      if (error.code !== 'ENOENT') throw error;\r\n      return { counter: 0, touches: 0 };\r\n    }\r\n  }\r\n\r\n  let state = load();\r\n\r\n  function readMarker() {\r\n    try {\r\n      const parsed = JSON.parse(fs.readFileSync(markerFile, 'utf8'));\r\n      if (parsed && typeof parsed.primary === 'string') return { primary: parsed.primary, epoch: Number(parsed.epoch) || 1 };\r\n    } catch {}\r\n    return { primary: 'database-0', epoch: 1 };\r\n  }\r\n\r\n  function writeMarker(primary, epoch) {\r\n    fs.mkdirSync(shared, { recursive: true });\r\n    fs.writeFileSync(markerFile, JSON.stringify({ primary, epoch }));\r\n  }\r\n\r\n  if (!fs.existsSync(markerFile) && name === 'database-0') writeMarker('database-0', 1);\r\n\r\n  const isPrimary = () => readMarker().primary === name;\r\n  const details = () => ({ ...state, pod: name, role: isPrimary() ? 'primary' : 'replica', primary: isPrimary(), primaryPod: readMarker().primary, epoch: readMarker().epoch });\r\n\r\n  function save() {\r\n    persistState(file, state);\r\n  }\r\n\r\n  function handler(requestObject, response) {\r\n    if (requestObject.method === 'GET' && (requestObject.url === '/health' || requestObject.url === '/state')) return send(response, 200, details());\r\n    if (requestObject.method === 'POST' && requestObject.url === '/promote') {\r\n      if (!isPrimary()) writeMarker(name, readMarker().epoch + 1);\r\n      return send(response, 200, details());\r\n    }\r\n    if (requestObject.method === 'POST' && requestObject.url === '/replicate') return send(response, 409, { error: 'Push replication is not used; replicas pull from the primary' });\r\n    if (requestObject.method === 'POST' && requestObject.url === '/backup') {\r\n      if (!isPrimary()) return send(response, 409, { error: 'Only the primary accepts backups', primary: readMarker().primary });\r\n      const directoryPath = path.join(shared, 'backups');\r\n      fs.mkdirSync(directoryPath, { recursive: true });\r\n      const snapshot = { ...state, createdAt: new Date().toISOString(), pod: name, epoch: readMarker().epoch };\r\n      const stamp = snapshot.createdAt.replace(/[:.]/g, '-');\r\n      fs.writeFileSync(path.join(directoryPath, `${stamp}.json`), JSON.stringify(snapshot));\r\n      fs.writeFileSync(path.join(directoryPath, 'latest.json'), JSON.stringify(snapshot));\r\n      const files = fs.readdirSync(directoryPath).filter(item => item !== 'latest.json' && item.endsWith('.json')).sort();\r\n      for (const item of files.slice(0, Math.max(0, files.length - 10))) fs.rmSync(path.join(directoryPath, item), { force: true });\r\n      return send(response, 200, { ...state, backup: `${stamp}.json` });\r\n    }\r\n    if (requestObject.method === 'POST' && requestObject.url === '/restore') {\r\n      if (!isPrimary()) return send(response, 409, { error: 'Only the primary can restore', primary: readMarker().primary });\r\n      let snapshot;\r\n      try {\r\n        snapshot = JSON.parse(fs.readFileSync(path.join(shared, 'backups', 'latest.json'), 'utf8'));\r\n      } catch {\r\n        return send(response, 404, { error: 'No backup exists yet; take a backup first' });\r\n      }\r\n      state = { counter: snapshot.counter, touches: snapshot.touches || 0 };\r\n      save();\r\n      return send(response, 200, { ...state, restoredFrom: snapshot.createdAt || 'latest.json' });\r\n    }\r\n    if (requestObject.method === 'POST' && (requestObject.url === '/increment' || requestObject.url === '/touch')) {\r\n      if (!isPrimary()) return send(response, 409, { error: 'Replica is read-only', primary: readMarker().primary });\r\n      if (requestObject.url === '/increment') {\r\n        if (state.counter >= Number.MAX_SAFE_INTEGER) return send(response, 409, { error: 'Counter limit reached' });\r\n        state = { ...state, counter: state.counter + 1 };\r\n      } else {\r\n        state = { ...state, touches: state.touches + 1 };\r\n      }\r\n      save();\r\n      return send(response, 200, details());\r\n    }\r\n    return send(response, 404, { error: 'Not found' });\r\n  }\r\n\r\n  handler.adopt = remote => {\r\n    if (isPrimary() || !remote || !Number.isSafeInteger(remote.counter)) return;\r\n    if (remote.counter >= state.counter) {\r\n      state = { counter: remote.counter, touches: Number.isSafeInteger(remote.touches) ? remote.touches : state.touches };\r\n      save();\r\n    }\r\n  };\r\n  handler.role = isPrimary;\r\n  return handler;\r\n}\r\n\r\nasync function replicaSync(database) {\r\n  const marker = readShared('primary.json', { primary: 'database-0' });\r\n  if (marker.primary === podName || podName === 'local') return;\r\n  try {\r\n    const result = await internal(`${marker.primary}.database`, '/state', 'GET', {}, undefined, 2000);\r\n    if (result.status === 200) database.adopt(JSON.parse(result.data));\r\n  } catch {}\r\n}\r\n\r\nasync function trafficLoop() {\r\n  while (true) {\r\n    try {\r\n      await internal('gateway', `/work?source=traffic&t=${Date.now()}`);\r\n    } catch (error) {\r\n      console.error('Traffic request failed:', error.message);\r\n    }\r\n    await new Promise(resolve => setTimeout(resolve, 15));\r\n  }\r\n}\r\n\r\nfunction start() {\r\n  if (role === 'traffic') {\r\n    for (let worker = 0; worker < 4; worker += 1) trafficLoop();\r\n    return;\r\n  }\r\n  let handler;\r\n  if (role === 'database') {\r\n    handler = createDatabaseHandler(dataDirectory);\r\n    setInterval(() => replicaSync(handler).catch(error => console.error('Replica sync failed:', error.message)), 2000).unref();\r\n  } else if (role === 'api') {\r\n    handler = apiHandler;\r\n  } else if (role === 'gateway') {\r\n    handler = createGateway(createStats());\r\n  } else if (role === 'loadbalancer') {\r\n    handler = createLoadBalancer(createStats());\r\n  } else if (role === 'cdn') {\r\n    handler = createCdn(createStats());\r\n  } else {\r\n    handler = createUi();\r\n  }\r\n  http.createServer((requestObject, response) => {\r\n    Promise.resolve().then(() => handler(requestObject, response)).catch(error => {\r\n      console.error(error);\r\n      if (!response.headersSent) send(response, 503, { error: error.message });\r\n      else response.destroy();\r\n    });\r\n  }).listen(port, '0.0.0.0', () => console.log(`${role} ${podName} listening on ${port}`));\r\n}\r\n\r\nif (require.main === module) start();\r\nmodule.exports = {\r\n  apiHandler,\r\n  collectStatus,\r\n  createCdn,\r\n  createDatabaseHandler,\r\n  createGateway,\r\n  createLoadBalancer,\r\n  createUi,\r\n  dbRequest,\r\n  listBackups,\r\n  primaryName,\r\n  resolveBackends,\r\n  spendCpu\r\n};\r\n"
  security.js: "'use strict';\r\n\r\nfunction isSameOriginMutation(request) {\r\n  const origin = request.headers.origin;\r\n  const host = request.headers.host;\r\n  if (!origin || !host || request.headers['content-type'] !== 'application/json') return false;\r\n  try {\r\n    const url = new URL(origin);\r\n    return (url.protocol === 'http:' || url.protocol === 'https:') && url.host === host && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname);\r\n  } catch {\r\n    return false;\r\n  }\r\n}\r\n\r\nfunction isLabPod(name) {\r\n  return typeof name === 'string' && /^(gateway|loadbalancer|cdn|ui|api|database|traffic)-/.test(name);\r\n}\r\n\r\nmodule.exports = { isSameOriginMutation, isLabPod };\r\n"
  index.html: "<!doctype html>\r\n<html lang=\"en\">\r\n<head>\r\n  <meta charset=\"utf-8\">\r\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n  <title>Kubernetes Landscape Control Room</title>\r\n  <link rel=\"stylesheet\" href=\"/app.css\">\r\n  <script src=\"/browser.js\" defer></script>\r\n</head>\r\n<body>\r\n  <header><div class=\"wrap masthead\"><div><div class=\"eyebrow\">K3S LAB · 1 SERVER + 3 AGENTS</div><h1>Kubernetes landscape</h1></div><div class=\"connection\"><span class=\"dot\" id=\"connection-dot\"></span><span id=\"connection\">Connecting</span></div></div></header>\r\n  <main class=\"wrap\">\r\n    <div class=\"intro\"><div><h2>Cluster control room</h2><p>Live workloads, autoscaling and disaster recovery</p></div><span id=\"updated\">Waiting for first update</span></div>\r\n    <div id=\"alert\" class=\"alert\" role=\"status\" hidden></div>\r\n    <section class=\"flow\" aria-label=\"Request path\"><span>Browser</span><b>→</b><span>Traefik ingress</span><b>→</b><span>Gateway</span><b>→</b><span>Load balancer</span><b>→</b><span>CDN</span><b>→</b><span>UI</span><b>→</b><span>API</span><b>→</b><span>Database</span></section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">MANAGEMENT</div><h2>Cluster UIs</h2></div></div>\r\n      <p class=\"muted\">Both UIs run as containers on the lab network and use the persisted admin kubeconfig; they are published on loopback only.</p>\r\n      <div class=\"actions\"><a class=\"button\" id=\"headlamp-link\" href=\"#\">Headlamp (18084)</a><a class=\"button secondary\" id=\"kubewall-link\" href=\"#\">KubeWall (18085)</a></div>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">CLUSTER</div><h2>Topology</h2></div></div>\r\n      <p class=\"muted\">One control-plane node and three workers. The control plane carries <code>k3s.io/lab-control-plane=true:NoSchedule</code>, so every lab pod runs on a worker; all lab pods share one hostname topology spread constraint, so the seven pods and their HPA scale-ups land on all three.</p>\r\n      <div class=\"table-wrap\"><table><thead><tr><th>Node</th><th>Roles</th><th>Taints</th><th>Lab pods</th><th>Placement</th></tr></thead><tbody id=\"nodes\"></tbody></table></div>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">EDGE PIPELINE</div><h2>Component usage</h2></div></div>\r\n      <p class=\"muted\">Round-robin balancing across CDN pods, cache hit ratio, and per-component request rate.</p>\r\n      <div class=\"table-wrap\"><table><thead><tr><th>Component</th><th>Ready / desired</th><th>Requests/sec</th><th>In flight</th><th>Detail</th></tr></thead><tbody id=\"components\"></tbody></table></div>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">AUTOSCALING</div><h2>Traffic &amp; pod scaling</h2></div><div class=\"actions\"><button id=\"traffic-off\" class=\"secondary\">Off</button><button id=\"traffic-low\">Low load</button><button id=\"traffic-high\">High load</button></div></div>\r\n      <p class=\"muted\" id=\"traffic-state\">Reading traffic state...</p>\r\n      <div class=\"table-wrap\"><table><thead><tr><th>Workload</th><th>Ready / desired</th><th>CPU target</th><th>Current CPU</th><th>HPA range</th></tr></thead><tbody id=\"workloads\"></tbody></table></div>\r\n      <p class=\"note\">The traffic generator drives the full chain. HPAs need metrics-server samples, so scale-up and scale-down take tens of seconds. Scale-down is intentionally slow (stabilisation window).</p>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">PRIMARY / REPLICA + BACKUPS</div><h2>Database &amp; disaster recovery</h2></div><div class=\"actions\"><button id=\"increment\">Add to counter</button><button id=\"backup\" class=\"secondary\">Back up now</button></div></div>\r\n      <div class=\"database\">\r\n        <div><div class=\"metric-label\">SAVED COUNTER</div><div class=\"counter\" id=\"counter\">—</div></div>\r\n        <div><div class=\"metric-label\">DB QUERIES</div><div class=\"counter small\" id=\"touches\">—</div></div>\r\n        <div><div class=\"metric-label\">PRIMARY POD</div><div class=\"primary-pod\" id=\"database-primary\">—</div></div>\r\n      </div>\r\n      <p id=\"database-status\">Checking database...</p>\r\n      <div class=\"actions danger-actions\"><button id=\"failover\" class=\"danger\">Simulate primary failure</button><button id=\"disaster\" class=\"danger\">Simulate total DB loss</button><button id=\"recover\" class=\"secondary\">Recover from backup</button><button id=\"restore\" class=\"secondary\">Restore latest backup</button></div>\r\n      <p class=\"note\">Replica pulls from the primary every few seconds, so a promotion loses at most a couple of seconds of writes. Backups are written to a host-mounted volume. Recovery rolls the counter back to the latest snapshot (RPO), and a full StatefulSet restart is the RTO exercise.</p>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">SCHEDULER VIEW</div><h2>Pods</h2></div></div>\r\n      <div class=\"table-wrap\"><table><thead><tr><th>Name</th><th>Node</th><th>Phase</th><th>Ready</th><th>Restarts</th><th>CPU</th></tr></thead><tbody id=\"pods\"></tbody></table></div>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">CONTROL PLANE</div><h2>Recent events</h2></div></div>\r\n      <ul id=\"events\" class=\"events\"></ul>\r\n    </section>\r\n\r\n    <section class=\"section\">\r\n      <div class=\"section-title\"><div><div class=\"eyebrow\">CKA PREPARATION</div><h2>Practice commands</h2></div></div>\r\n      <p class=\"muted\">Run these on the Linux host. They use the lab's own kubeconfig inside the K3s container.</p>\r\n      <pre class=\"commands\">docker compose -f kubernetes.yml exec k3s kubectl get all -n landscape-lab\r\ndocker compose -f kubernetes.yml exec k3s kubectl get hpa -n landscape-lab -w\r\ndocker compose -f kubernetes.yml exec k3s kubectl describe statefulset database -n landscape-lab\r\ndocker compose -f kubernetes.yml exec k3s kubectl get pvc,pv -n landscape-lab\r\ndocker compose -f kubernetes.yml exec k3s kubectl rollout status statefulset/api -n landscape-lab\r\ndocker compose -f kubernetes.yml exec k3s kubectl scale statefulset/traffic -n landscape-lab --replicas=2\r\ndocker compose -f kubernetes.yml exec k3s kubectl delete pod database-0 -n landscape-lab</pre>\r\n      <p class=\"note\">Open <a href=\"/architecture.svg\">the architecture diagram</a> and read <code>kubernetes/CKA-STUDY-GUIDE.md</code> in the repository for exercises mapped to the CKA domains.</p>\r\n    </section>\r\n  </main>\r\n  <footer class=\"wrap\">K3s · 1 server + 3 agents · StatefulSet + HPA · host bind mounts · NetworkPolicy · shared hostPath backups</footer>\r\n</body>\r\n</html>\r\n"
  app.css: ":root { font-family: 'Trebuchet MS', sans-serif; color: #142327; background: #f5f7f5; font-synthesis: none; }\r\n* { box-sizing: border-box; }\r\nbody { margin: 0; background: linear-gradient(180deg, #edf4f0 0, #f5f7f5 300px); }\r\n.wrap { width: min(1120px, calc(100% - 48px)); margin: auto; }\r\nheader { background: #102e2e; color: white; border-bottom: 4px solid #d8b558; }\r\n.masthead { min-height: 110px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }\r\nh1, h2 { font-family: Georgia, serif; margin: 0; }\r\nh1 { font-size: 30px; }\r\nh2 { font-size: 22px; }\r\n.eyebrow { font-size: 11px; font-weight: 700; color: #48726a; margin-bottom: 8px; }\r\nheader .eyebrow { color: #9dc9b9; }\r\n.connection { display: flex; align-items: center; gap: 8px; font-size: 13px; }\r\n.dot { width: 9px; height: 9px; border-radius: 50%; background: #dfaa4f; }\r\n.dot.live { background: #75d3a6; }\r\n.dot.failed { background: #ee817a; }\r\n.intro { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 35px 0 20px; }\r\n.intro p, .muted { color: #647674; margin: 5px 0 0; font-size: 14px; }\r\n#updated { font-size: 12px; color: #647674; }\r\n.flow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 18px 20px; background: #fff; border: 1px solid #dce5df; border-left: 4px solid #5b9983; font-size: 13px; font-weight: 600; }\r\n.flow b { color: #8aa69b; }\r\n.section { border-bottom: 1px solid #d5dfd9; padding: 30px 0; }\r\n.section-title { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }\r\n.actions { display: flex; flex-wrap: wrap; gap: 8px; }\r\n.danger-actions { margin-top: 16px; }\r\nbutton { border: 1px solid #164d42; background: #164d42; color: white; border-radius: 4px; padding: 10px 15px; font: 600 13px 'Trebuchet MS', sans-serif; cursor: pointer; }\r\nbutton:hover { background: #236957; }\r\nbutton.secondary { color: #164d42; background: transparent; }\r\nbutton.danger { color: #9b3733; border-color: #c99590; background: transparent; }\r\nbutton:disabled { opacity: .5; cursor: not-allowed; }\r\nbutton:focus-visible, a:focus-visible { outline: 3px solid #d8a23c; outline-offset: 2px; }\r\n.table-wrap { overflow-x: auto; margin-top: 18px; }\r\ntable { width: 100%; border-collapse: collapse; min-width: 620px; text-align: left; }\r\nth { font-size: 11px; color: #667b75; text-transform: uppercase; letter-spacing: .04em; padding: 10px; border-bottom: 2px solid #cfdad4; }\r\ntd { padding: 10px; border-bottom: 1px solid #e2e9e5; font-size: 13px; vertical-align: top; }\r\ntd:first-child { font-weight: 700; }\r\ntr:hover td { background: #f0f5f2; }\r\n.alert { margin-top: 16px; padding: 12px 14px; background: #fff5e5; border: 1px solid #e2c48c; color: #73571f; font-size: 13px; }\r\n.database { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin: 18px 0; padding: 18px 20px; background: #fff; border: 1px solid #dce5df; }\r\n.metric-label { font-size: 10px; font-weight: 700; color: #6c817a; letter-spacing: .05em; }\r\n.counter { font-family: Georgia, serif; font-size: 40px; line-height: 1.1; }\r\n.counter.small { font-size: 28px; }\r\n.primary-pod { font-family: monospace; font-size: 15px; padding-top: 10px; }\r\n.note { font-size: 12px; color: #6f827c; margin: 14px 0 0; max-width: 900px; }\r\n.events { list-style: none; margin: 18px 0 0; padding: 0; font-size: 13px; }\r\n.events li { padding: 10px 0; border-bottom: 1px solid #e2e9e5; display: grid; grid-template-columns: 150px 90px 1fr; gap: 12px; }\r\n.events .reason { font-weight: 700; }\r\n.events time { color: #7a8d87; font-size: 12px; }\r\n.events .empty { color: #7a8d87; display: block; }\r\n.commands { background: #102e2e; color: #d9efe5; padding: 16px 18px; overflow-x: auto; font-size: 12.5px; line-height: 1.8; border-radius: 4px; }\r\ncode { background: #e7efea; padding: 1px 5px; border-radius: 3px; font-size: .92em; }\r\na { color: #175c9a; }\r\nfooter { padding: 26px 0 34px; color: #6b7f79; font-size: 12px; }\r\n\r\n.actions a.button { display: inline-block; border: 1px solid #164d42; background: #164d42; color: white; border-radius: 4px; padding: 10px 15px; font: 600 13px 'Trebuchet MS', sans-serif; text-decoration: none; }\r\n.actions a.button:hover { background: #236957; }\r\n.actions a.button.secondary { color: #164d42; background: transparent; }\r\n"
  browser.js: "'use strict';\r\n\r\nconst element = id => document.getElementById(id);\r\nlet busy = false;\r\n\r\nfunction row(values) {\r\n  const result = document.createElement('tr');\r\n  for (const value of values) {\r\n    const cell = document.createElement('td');\r\n    cell.textContent = String(value ?? '—');\r\n    result.appendChild(cell);\r\n  }\r\n  return result;\r\n}\r\n\r\nfunction replicaText(statefulsets, name) {\r\n  const workload = statefulsets.find(item => item.metadata.name === name);\r\n  return workload ? `${workload.status.readyReplicas || 0} / ${workload.spec.replicas}` : 'Unavailable';\r\n}\r\n\r\nfunction hpaCpu(hpas, name) {\r\n  const hpa = hpas.find(item => item.metadata.name === name);\r\n  if (!hpa) return { target: '—', current: '—', range: '—' };\r\n  const find = list => list?.find(item => item.type === 'Resource' && item.resource.name === 'cpu')?.resource;\r\n  const current = find(hpa.status?.currentMetrics)?.current?.averageUtilization;\r\n  const target = find(hpa.spec?.metrics)?.target?.averageUtilization;\r\n  return { target: target == null ? '—' : `${target}%`, current: current == null ? 'Pending' : `${current}%`, range: `${hpa.spec.minReplicas}–${hpa.spec.maxReplicas}` };\r\n}\r\n\r\nfunction render(status) {\r\n  const statefulsets = status.statefulsets.data?.items || [];\r\n  const hpas = status.hpas.data?.items || [];\r\n  const pods = status.pods.data?.items || [];\r\n  const metrics = status.metrics.data?.items || [];\r\n  const gateway = status.gateway.data || {};\r\n  const loadbalancer = status.loadbalancer.data || {};\r\n  const cdn = status.cdn.data || {};\r\n  const database = status.database.data || {};\r\n\r\n  const podsByNode = new Map();\r\n  for (const pod of pods) {\r\n    const node = pod.spec?.nodeName || 'unscheduled';\r\n    if (!podsByNode.has(node)) podsByNode.set(node, []);\r\n    podsByNode.get(node).push(pod.metadata.name);\r\n  }\r\n  const nodes = status.nodes?.data?.items || [];\r\n  const isControlPlane = node => (node.roles || []).some(role => role === 'control-plane' || role === 'master');\r\n  const placement = nodes.length\r\n    ? [...nodes].sort((left, right) => Number(isControlPlane(right)) - Number(isControlPlane(left)) || left.name.localeCompare(right.name)).map(node => {\r\n      const names = podsByNode.get(node.name) || [];\r\n      const roles = node.roles?.length ? node.roles.join(', ') : 'worker';\r\n      const taints = (node.taints || []).map(taint => `${taint.key}${taint.value ? `=${taint.value}` : ''}:${taint.effect}`).join(', ');\r\n      return [\r\n        node.name,\r\n        node.unschedulable ? `${roles} (cordoned)` : roles,\r\n        taints || '—',\r\n        node.podCount == null ? '—' : node.podCount,\r\n        names.join(', ') || '—'\r\n      ];\r\n    })\r\n    : [...podsByNode.entries()].sort(([left], [right]) => left.localeCompare(right)).map(([node, names]) => [\r\n      node,\r\n      node === 'k3s-server' ? 'control-plane' : 'worker',\r\n      '—',\r\n      names.length,\r\n      names.join(', ') || '—'\r\n    ]);\r\n  element('nodes').replaceChildren(...placement.map(row));\r\n\r\n  const distribution = (loadbalancer.distribution || []).map(item => `${item.pod}: ${item.requests}`).join(' · ') || 'No samples yet';\r\n  element('components').replaceChildren(\r\n    row(['Gateway', replicaText(statefulsets, 'gateway'), gateway.requestsPerSecond ?? '—', gateway.inFlight ?? '—', `p95 ${gateway.latencyP95Ms ?? 0} ms`]),\r\n    row(['Load balancer', replicaText(statefulsets, 'loadbalancer'), loadbalancer.requestsPerSecond ?? '—', loadbalancer.inFlight ?? '—', distribution]),\r\n    row(['CDN', replicaText(statefulsets, 'cdn'), cdn.requestsPerSecond ?? '—', cdn.inFlight ?? '—', `${cdn.hitRatio ?? 0}% cache hit · ${cdn.entries ?? 0} objects`]),\r\n    row(['UI', replicaText(statefulsets, 'ui'), '—', '—', `${pods.filter(pod => pod.metadata.name.startsWith('ui-')).length} pod(s) reporting`]),\r\n    row(['API', replicaText(statefulsets, 'api'), '—', '—', `${pods.filter(pod => pod.metadata.name.startsWith('api-')).length} pod(s) reporting`])\r\n  );\r\n\r\n  element('workloads').replaceChildren(...['gateway', 'loadbalancer', 'cdn', 'ui', 'api'].map(name => {\r\n    const cpu = hpaCpu(hpas, name);\r\n    return row([name.toUpperCase(), replicaText(statefulsets, name), cpu.target, cpu.current, cpu.range]);\r\n  }));\r\n\r\n  const traffic = statefulsets.find(item => item.metadata.name === 'traffic');\r\n  const level = traffic ? traffic.spec.replicas : 0;\r\n  const labels = ['off', 'low', 'medium', 'high'];\r\n  element('traffic-state').textContent = traffic\r\n    ? `Traffic generator: ${labels[level] || level} load · ${traffic.status.readyReplicas || 0} of ${level} generator pod(s) ready`\r\n    : 'Traffic generator state unavailable';\r\n\r\n  element('counter').textContent = database.counter ?? '—';\r\n  element('touches').textContent = database.touches ?? '—';\r\n  element('database-primary').textContent = database.activePod ? `${database.activePod} (${database.role})` : '—';\r\n  if (status.database.error) {\r\n    element('database-status').textContent = `Database unavailable: ${status.database.error}`;\r\n  } else {\r\n    const backups = status.backups.data?.count ?? 0;\r\n    const failover = database.failover ? ' · automatic failover just promoted this replica' : '';\r\n    element('database-status').textContent = `Primary ${database.activePod} responding · epoch ${database.epoch} · ${backups} backup(s) on the host volume${failover}`;\r\n  }\r\n\r\n  element('pods').replaceChildren(...(pods.length ? pods.map(pod => {\r\n    const containers = pod.status.containerStatuses || [];\r\n    const podMetric = metrics.find(item => item.metadata.name === pod.metadata.name);\r\n    return row([\r\n      pod.metadata.name,\r\n      pod.spec?.nodeName ?? '—',\r\n      pod.status.phase,\r\n      `${containers.filter(item => item.ready).length} / ${pod.spec.containers.length}`,\r\n      containers.reduce((sum, item) => sum + item.restartCount, 0),\r\n      podMetric ? podMetric.containers.map(item => item.usage.cpu).join(', ') : 'Pending'\r\n    ]);\r\n  }) : [row(['No pods reported', '—', '—', '—', '—', '—'])]));\r\n\r\n  const events = status.events.data?.items || [];\r\n  if (events.length) {\r\n    element('events').replaceChildren(...events.map(event => {\r\n      const item = document.createElement('li');\r\n      const name = document.createElement('span');\r\n      name.textContent = event.involvedObject?.name || '—';\r\n      const reason = document.createElement('span');\r\n      reason.className = 'reason';\r\n      reason.textContent = event.reason || event.type || 'Event';\r\n      const message = document.createElement('span');\r\n      message.textContent = event.message || '';\r\n      const time = document.createElement('time');\r\n      time.textContent = event.lastTimestamp ? new Date(event.lastTimestamp).toLocaleTimeString() : '';\r\n      item.append(name, reason, message, time);\r\n      return item;\r\n    }));\r\n  } else {\r\n    const item = document.createElement('li');\r\n    item.className = 'empty';\r\n    item.textContent = 'No recent lab events.';\r\n    element('events').replaceChildren(item);\r\n  }\r\n\r\n  const errors = Object.entries(status).filter(([, value]) => value.error).map(([name, value]) => `${name}: ${value.error}`);\r\n  element('alert').hidden = !errors.length;\r\n  element('alert').textContent = errors.join(' | ');\r\n  element('connection').textContent = 'Connected';\r\n  element('connection-dot').className = 'dot live';\r\n  element('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;\r\n}\r\n\r\nasync function refresh() {\r\n  try {\r\n    const response = await fetch('/api/status', { cache: 'no-store' });\r\n    if (!response.ok) throw new Error(`HTTP ${response.status}`);\r\n    render(await response.json());\r\n  } catch (error) {\r\n    element('connection').textContent = 'Disconnected';\r\n    element('connection-dot').className = 'dot failed';\r\n    element('alert').hidden = false;\r\n    element('alert').textContent = `Status unavailable: ${error.message}`;\r\n  }\r\n}\r\n\r\nasync function command(path, body = {}) {\r\n  if (busy) return false;\r\n  busy = true;\r\n  document.querySelectorAll('button').forEach(button => { button.disabled = true; });\r\n  try {\r\n    const response = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });\r\n    const result = await response.json();\r\n    if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);\r\n    await refresh();\r\n    return true;\r\n  } catch (error) {\r\n    element('alert').hidden = false;\r\n    element('alert').textContent = `Action failed: ${error.message}`;\r\n    return false;\r\n  } finally {\r\n    busy = false;\r\n    document.querySelectorAll('button').forEach(button => { button.disabled = false; });\r\n  }\r\n}\r\n\r\nelement('traffic-off').addEventListener('click', () => command('/api/traffic', { level: 0 }));\r\nelement('traffic-low').addEventListener('click', () => command('/api/traffic', { level: 1 }));\r\nelement('traffic-high').addEventListener('click', () => command('/api/traffic', { level: 3 }));\r\nelement('increment').addEventListener('click', () => command('/api/database/increment'));\r\nelement('backup').addEventListener('click', () => command('/api/database/backup'));\r\nelement('restore').addEventListener('click', () => { if (confirm('Restore the latest backup? Newer writes will be rolled back.')) command('/api/database/restore'); });\r\nelement('failover').addEventListener('click', () => { if (confirm('Delete the primary database pod? The replica will be promoted automatically.')) command('/api/database/failover'); });\r\nelement('disaster').addEventListener('click', () => { if (confirm('Scale the database StatefulSet to zero? All database access stops until recovery.')) command('/api/database/scale', { replicas: 0 }); });\r\nelement('recover').addEventListener('click', async () => {\r\n  if (!confirm('Scale the database back to two pods and restore the latest backup?')) return;\r\n  if (await command('/api/database/scale', { replicas: 2 })) await command('/api/database/restore');\r\n});\r\nconst uiHost = `${location.protocol}//${location.hostname}`;\r\nelement('headlamp-link').href = `${uiHost}:18084/`;\r\n// KubeWall serves HTTPS (SSE requires TLS off localhost); accept the self-signed warning.\r\nelement('kubewall-link').href = `https://${location.hostname}:18085/`;\r\n\r\nrefresh();\r\nsetInterval(refresh, 5000);\r\n"
  architecture.svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 1010\" width=\"1200\" height=\"1010\" role=\"img\" aria-labelledby=\"title desc\">\r\n  <title id=\"title\">Kubernetes landscape architecture</title>\r\n  <desc id=\"desc\">Request path from browser through Traefik ingress, gateway, load balancer, CDN, UI and API StatefulSets with horizontal pod autoscalers, to a primary and replica database StatefulSet, running on a K3s cluster with one tainted control plane, three workers, a shared hostPath volume and two management UIs.</desc>\r\n  <defs>\r\n    <marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\r\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#3f6b5e\"/>\r\n    </marker>\r\n    <style>\r\n      .box { fill: #ffffff; stroke: #7fa596; stroke-width: 1.5; rx: 6; }\r\n      .chip { fill: #eef5f1; stroke: #a9c4b8; stroke-width: 1; rx: 4; }\r\n      .warn { fill: #fdf6e8; stroke: #d8b558; stroke-width: 1.5; rx: 6; }\r\n      .t { font-family: 'Trebuchet MS', Arial, sans-serif; fill: #142327; font-size: 12px; }\r\n      .small { font-size: 10.5px; fill: #5c736c; }\r\n      .name { font-size: 13px; font-weight: 700; }\r\n      .mono { font-family: Consolas, monospace; font-size: 10.5px; fill: #40564f; }\r\n      .line { stroke: #3f6b5e; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }\r\n      .dash { stroke: #b0862c; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }\r\n      .label { font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 10.5px; fill: #6b7f79; }\r\n    </style>\r\n  </defs>\r\n  <rect width=\"1200\" height=\"900\" fill=\"#f5f7f5\"/>\r\n  <text x=\"55\" y=\"48\" class=\"t\" font-size=\"24\" font-family=\"Georgia, serif\">Kubernetes landscape — request path, autoscaling and disaster recovery</text>\r\n  <text x=\"55\" y=\"70\" class=\"small\">K3s 1 server + 3 agents in a dedicated Compose network · namespace landscape-lab · NetworkPolicy segmented · host-persisted data</text>\r\n\r\n  <rect x=\"30\" y=\"92\" width=\"1140\" height=\"840\" fill=\"#fbfdfb\" stroke=\"#cfdad4\" stroke-width=\"1.5\" rx=\"10\"/>\r\n  <text x=\"50\" y=\"116\" class=\"label\">LINUX HOST · kubernetes.yml · docker compose network kubernetes-lab</text>\r\n\r\n  <g>\r\n    <rect x=\"52\" y=\"150\" width=\"112\" height=\"100\" class=\"box\"/>\r\n    <text x=\"66\" y=\"180\" class=\"t name\">Browser</text>\r\n    <text x=\"66\" y=\"200\" class=\"small\">Tap the lab at</text>\r\n    <text x=\"66\" y=\"217\" class=\"mono\">localhost:18080</text>\r\n    <text x=\"66\" y=\"232\" class=\"small\">same-origin</text>\r\n    <text x=\"66\" y=\"246\" class=\"small\">mutation checks</text>\r\n\r\n    <rect x=\"200\" y=\"150\" width=\"134\" height=\"100\" class=\"box\"/>\r\n    <text x=\"214\" y=\"180\" class=\"t name\">Traefik Ingress</text>\r\n    <text x=\"214\" y=\"200\" class=\"small\">K3s bundled controller</text>\r\n    <text x=\"214\" y=\"217\" class=\"mono\">ingressClassName:</text>\r\n    <text x=\"214\" y=\"232\" class=\"mono\">traefik</text>\r\n    <text x=\"214\" y=\"246\" class=\"small\">no TLS or auth</text>\r\n\r\n    <rect x=\"368\" y=\"150\" width=\"142\" height=\"100\" class=\"box\"/>\r\n    <text x=\"382\" y=\"180\" class=\"t name\">Gateway</text>\r\n    <text x=\"382\" y=\"200\" class=\"small\">StatefulSet + HPA</text>\r\n    <text x=\"382\" y=\"217\" class=\"small\">1–3 pods · request</text>\r\n    <text x=\"382\" y=\"234\" class=\"small\">counter, p95 latency</text>\r\n    <text x=\"382\" y=\"246\" class=\"mono\">/_gateway/stats</text>\r\n\r\n    <rect x=\"544\" y=\"150\" width=\"156\" height=\"100\" class=\"box\"/>\r\n    <text x=\"558\" y=\"180\" class=\"t name\">Load balancer</text>\r\n    <text x=\"558\" y=\"200\" class=\"small\">StatefulSet + HPA 1–3</text>\r\n    <text x=\"558\" y=\"217\" class=\"small\">round-robin across CDN</text>\r\n    <text x=\"558\" y=\"234\" class=\"small\">pod IPs (DNS SRV)</text>\r\n    <text x=\"558\" y=\"246\" class=\"mono\">/_lb/stats</text>\r\n\r\n    <rect x=\"728\" y=\"150\" width=\"150\" height=\"100\" class=\"box\"/>\r\n    <text x=\"742\" y=\"180\" class=\"t name\">CDN</text>\r\n    <text x=\"742\" y=\"200\" class=\"small\">StatefulSet + HPA 1–3</text>\r\n    <text x=\"742\" y=\"217\" class=\"small\">15 s GET cache, hit</text>\r\n    <text x=\"742\" y=\"234\" class=\"small\">ratio, bytes saved</text>\r\n    <text x=\"742\" y=\"246\" class=\"mono\">/_cdn/stats</text>\r\n  </g>\r\n\r\n  <path class=\"line\" d=\"M164,200 H196\"/>\r\n  <path class=\"line\" d=\"M334,200 H364\"/>\r\n  <path class=\"line\" d=\"M510,200 H540\"/>\r\n  <path class=\"line\" d=\"M700,200 H724\"/>\r\n\r\n  <path class=\"line\" d=\"M803,250 V288 H975 V326\"/>\r\n\r\n  <g>\r\n    <rect x=\"852\" y=\"330\" width=\"252\" height=\"126\" class=\"box\"/>\r\n    <text x=\"866\" y=\"356\" class=\"t name\">UI StatefulSet + HPA</text>\r\n    <text x=\"866\" y=\"374\" class=\"small\">1–5 pods, CPU target 60%</text>\r\n    <text x=\"866\" y=\"391\" class=\"small\">serves dashboard and proxies</text>\r\n    <text x=\"866\" y=\"408\" class=\"small\">/api/* to the API service</text>\r\n    <rect x=\"866\" y=\"420\" width=\"66\" height=\"22\" class=\"chip\"/><text x=\"875\" y=\"436\" class=\"small\">ui-…</text>\r\n    <rect x=\"940\" y=\"420\" width=\"66\" height=\"22\" class=\"chip\"/><text x=\"949\" y=\"436\" class=\"small\">ui-…</text>\r\n    <rect x=\"1014\" y=\"420\" width=\"66\" height=\"22\" class=\"chip\"/><text x=\"1023\" y=\"436\" class=\"small\">ui-…</text>\r\n\r\n    <rect x=\"596\" y=\"330\" width=\"220\" height=\"126\" class=\"box\"/>\r\n    <text x=\"610\" y=\"356\" class=\"t name\">API StatefulSet + HPA</text>\r\n    <text x=\"610\" y=\"374\" class=\"small\">1–5 pods, CPU target 60%</text>\r\n    <text x=\"610\" y=\"391\" class=\"small\">Kubernetes API reads and</text>\r\n    <text x=\"610\" y=\"408\" class=\"small\">scoped control actions</text>\r\n    <text x=\"610\" y=\"432\" class=\"mono\">/api/status, /work</text>\r\n\r\n    <rect x=\"316\" y=\"330\" width=\"242\" height=\"126\" class=\"box\"/>\r\n    <text x=\"330\" y=\"356\" class=\"t name\">Database StatefulSet</text>\r\n    <text x=\"330\" y=\"374\" class=\"small\">2 pods · ordered names · per-pod PVC</text>\r\n    <rect x=\"330\" y=\"386\" width=\"102\" height=\"24\" class=\"chip\"/><text x=\"338\" y=\"402\" class=\"small\">database-0 primary</text>\r\n    <rect x=\"440\" y=\"386\" width=\"102\" height=\"24\" class=\"chip\"/><text x=\"448\" y=\"402\" class=\"small\">database-1 replica</text>\r\n    <text x=\"330\" y=\"430\" class=\"small\">replica pulls every 2 s; API promotes</text>\r\n    <text x=\"330\" y=\"445\" class=\"small\">it when the primary fails</text>\r\n\r\n    <rect x=\"52\" y=\"330\" width=\"226\" height=\"126\" class=\"box\"/>\r\n    <text x=\"66\" y=\"356\" class=\"t name\">Host-persisted backups</text>\r\n    <text x=\"66\" y=\"376\" class=\"small\">hostPath, all three workers</text>\r\n    <text x=\"66\" y=\"394\" class=\"mono\">shared hostPath volume</text>\r\n    <text x=\"66\" y=\"409\" class=\"mono\">persisted on host</text>\r\n    <text x=\"66\" y=\"430\" class=\"small\">latest.json + 10 snapshots</text>\r\n  </g>\r\n\r\n  <path class=\"line\" d=\"M852,393 H820\"/>\r\n  <path class=\"line\" d=\"M596,393 H562\"/>\r\n  <path class=\"line\" d=\"M316,393 H282\"/>\r\n\r\n  <g>\r\n    <rect x=\"52\" y=\"556\" width=\"238\" height=\"88\" class=\"warn\"/>\r\n    <text x=\"66\" y=\"582\" class=\"t name\">Traffic generator</text>\r\n    <text x=\"66\" y=\"601\" class=\"small\">StatefulSet scaled 0–3 by the lab</text>\r\n    <text x=\"66\" y=\"618\" class=\"small\">4 workers per pod hit /work</text>\r\n    <text x=\"66\" y=\"635\" class=\"mono\">off · low · high</text>\r\n\r\n    <rect x=\"318\" y=\"556\" width=\"330\" height=\"88\" class=\"box\"/>\r\n    <text x=\"332\" y=\"582\" class=\"t name\">HorizontalPodAutoscalers</text>\r\n    <text x=\"332\" y=\"600\" class=\"small\">gateway · loadbalancer · cdn 1–3 at 70% CPU</text>\r\n    <text x=\"332\" y=\"616\" class=\"small\">ui · api 1–5 at 60% CPU</text>\r\n    <text x=\"332\" y=\"633\" class=\"small\">metrics-server samples; scale-down is slow</text>\r\n\r\n    <rect x=\"676\" y=\"556\" width=\"470\" height=\"88\" class=\"box\"/>\r\n    <text x=\"690\" y=\"582\" class=\"t name\">Where the data lives on the host</text>\r\n    <text x=\"690\" y=\"601\" class=\"mono\">${DATA_DIR}/kubernetes/k3s → K3s state + local-path PVCs</text>\r\n    <text x=\"690\" y=\"618\" class=\"mono\">${DATA_DIR}/kubernetes/shared → primary.json, backups/</text>\r\n    <text x=\"690\" y=\"635\" class=\"small\">delete the host directories and the lab starts empty</text>\r\n  </g>\r\n\r\n  <path class=\"dash\" d=\"M290,600 H305 V292 H439 V254\"/>\r\n  <text x=\"212\" y=\"540\" class=\"label\">drives the full chain</text>\r\n\r\n  <rect x=\"52\" y=\"676\" width=\"1094\" height=\"96\" fill=\"#eef5f1\" stroke=\"#b9cdc4\" stroke-width=\"1\" rx=\"6\"/>\r\n  <text x=\"68\" y=\"700\" class=\"t name\">NetworkPolicy segmentation (Ingress default-deny)</text>\r\n  <text x=\"68\" y=\"720\" class=\"small\">traefik + traffic → gateway → loadbalancer → cdn → ui → api → database (api and database peers)</text>\r\n  <text x=\"68\" y=\"741\" class=\"small\">No pod mounts a service-account token except the API, whose Role only lists pods, events, StatefulSets, HPAs, metrics and nodes, deletes database-0 and patches the database and traffic scale.</text>\r\n  <text x=\"68\" y=\"760\" class=\"small\">Volumes: local-path PVCs per database pod for data, a shared hostPath volume for the primary marker and backups. Nothing is stored in the container filesystem.</text>\r\n\r\n  <rect x=\"52\" y=\"788\" width=\"1094\" height=\"132\" fill=\"#fbfdfb\" stroke=\"#cfdad4\" stroke-width=\"1\" rx=\"8\"/>\r\n  <text x=\"68\" y=\"810\" class=\"label\">K3s cluster · 1 tainted control plane + 3 workers · replicas spread on kubernetes.io/hostname</text>\r\n\r\n  <rect x=\"68\" y=\"822\" width=\"190\" height=\"58\" class=\"box\"/>\r\n  <text x=\"80\" y=\"842\" class=\"t name\">k3s-server</text>\r\n  <text x=\"80\" y=\"858\" class=\"small\">control plane · tainted NoSchedule</text>\r\n  <text x=\"80\" y=\"872\" class=\"mono\">API 6443 · Traefik</text>\r\n\r\n  <rect x=\"274\" y=\"822\" width=\"170\" height=\"58\" class=\"box\"/>\r\n  <text x=\"286\" y=\"842\" class=\"t name\">k3s-agent-1</text>\r\n  <text x=\"286\" y=\"858\" class=\"small\">worker · ingress 18080</text>\r\n  <text x=\"286\" y=\"872\" class=\"mono\">mounts /shared</text>\r\n\r\n  <rect x=\"456\" y=\"822\" width=\"170\" height=\"58\" class=\"box\"/>\r\n  <text x=\"468\" y=\"842\" class=\"t name\">k3s-agent-2</text>\r\n  <text x=\"468\" y=\"858\" class=\"small\">worker · ingress 18081</text>\r\n  <text x=\"468\" y=\"872\" class=\"mono\">mounts /shared</text>\r\n\r\n  <rect x=\"638\" y=\"822\" width=\"170\" height=\"58\" class=\"box\"/>\r\n  <text x=\"650\" y=\"842\" class=\"t name\">k3s-agent-3</text>\r\n  <text x=\"650\" y=\"858\" class=\"small\">worker · ingress 18082</text>\r\n  <text x=\"650\" y=\"872\" class=\"mono\">mounts /shared</text>\r\n\r\n  <rect x=\"826\" y=\"822\" width=\"150\" height=\"58\" class=\"box\"/>\r\n  <text x=\"838\" y=\"842\" class=\"t name\">Headlamp</text>\r\n  <text x=\"838\" y=\"858\" class=\"small\">UI · localhost:18084</text>\r\n  <text x=\"838\" y=\"872\" class=\"mono\">v0.46.0</text>\r\n\r\n  <rect x=\"990\" y=\"822\" width=\"144\" height=\"58\" class=\"box\"/>\r\n  <text x=\"1002\" y=\"842\" class=\"t name\">KubeWall</text>\r\n  <text x=\"1002\" y=\"858\" class=\"small\">UI · localhost:18085</text>\r\n  <text x=\"1002\" y=\"872\" class=\"mono\">0.0.23</text>\r\n\r\n  <rect x=\"68\" y=\"890\" width=\"740\" height=\"22\" class=\"chip\"/>\r\n  <text x=\"78\" y=\"905\" class=\"mono\">shared hostPath /shared → ${DATA_DIR}/kubernetes/shared · primary.json + backups/ · database and API pods</text>\r\n  <rect x=\"826\" y=\"890\" width=\"308\" height=\"22\" class=\"chip\"/>\r\n  <text x=\"836\" y=\"905\" class=\"mono\">read /kube/config → https://k3s:6443</text>\r\n\r\n  <text x=\"55\" y=\"960\" class=\"label\">Request path: browser → Traefik → gateway → load balancer → CDN → UI → API → primary database. Replica promotes on failure; restore rolls back to the latest backup.</text>\r\n  <text x=\"55\" y=\"980\" class=\"label\">Practice: kubectl get all -n landscape-lab · kubectl get hpa -w · kubectl describe statefulset database · kubectl get pvc,pv · kubectl get nodes -o wide</text>\r\n</svg>\r\n"
