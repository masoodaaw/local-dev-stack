apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landscape
  namespace: landscape-lab
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: landscape-lab
  labels: {app.kubernetes.io/part-of: landscape-lab}
spec:
  serviceName: gateway-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway, app.kubernetes.io/part-of: landscape-lab}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: gateway}}
      containers:
        - name: gateway
          image: node:22-alpine
          command: ["node", "/app/app.js"]
          env: [{name: ROLE, value: gateway}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 5}
          resources: {requests: {cpu: 50m, memory: 48Mi}, limits: {cpu: 250m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
      volumes: [{name: app, configMap: {name: landscape-app}}]
---
