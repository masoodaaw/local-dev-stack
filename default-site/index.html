<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Not Configured</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            margin: 1rem;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 1.75rem; }
        p { color: #cbd5e1; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #334155;
            color: #94a3b8;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nothing Hosted Here Yet</h1>
        <p>This domain is active and connected to our server, but no website or service has been assigned to this address yet.</p>
        <p>Please check the URL or check back soon!</p>
        <div class="badge">Status: Server Online</div>
    </div>
</body>
</html>
