global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: docker-container-status
    scrape_interval: 10s
    static_configs:
      - targets: [container-status-exporter:9273]